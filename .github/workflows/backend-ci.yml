name: Backend CI

# Lint + Jest tests for the Node.js backend.
# Runs on every push/PR; deployment preview is handled by Railway's
# native GitHub integration (configure in Railway dashboard).

on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
      - 'backend/public/shared/i18n.js'
      - 'i18n.js'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'backend/public/shared/i18n.js'
      - 'i18n.js'
      - '.github/workflows/backend-ci.yml'

jobs:
  # ── ESLint ─────────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run ESLint
        run: npm run lint
        working-directory: backend

      - name: Ban unguarded new Date(row.updated_at).toISOString() (06-16 incident class)
        # 2026-06-16 RCA: PR #3422 → PR #3424 hotfix → PR #3427 carry-forward →
        # PR #3432 second hotfix. Three PRs, two prod incidents, same line of
        # code. Permanent fix is centralized helper backend/safe-date.js + this
        # gate so the unguarded pattern literally cannot be merged again.
        # See: https://github.com/HankHuang0516/EClaw/pull/3424
        # See: https://github.com/HankHuang0516/EClaw/pull/3432
        run: |
          set -e
          HITS=$(grep -rn --include='*.js' --exclude-dir=node_modules \
            -E 'new Date\([^)]*updated_at[^)]*\)\.toISOString' \
            backend/ \
            | grep -v 'safe-date.js' \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*)' \
            || true)
          if [ -n "$HITS" ]; then
            echo "::error::Unguarded new Date(row.updated_at).toISOString() detected."
            echo "::error::Use the safeUpdatedAtToISO(row) helper from backend/safe-date.js instead."
            echo "::error::Background: this pattern caused 2 prod incidents on 2026-06-16 (PRs #3422->#3424, #3427->#3432)."
            echo ""
            echo "$HITS"
            exit 1
          fi
          echo "OK - no unguarded new Date(...updated_at...).toISOString() outside safe-date.js."

  # ── i18n validation (fast, no npm ci needed) ────────────────────────────────
  i18n:
    name: i18n syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard against dead top-level i18n.js
        # The only live i18n.js is backend/public/shared/i18n.js. A top-level
        # ./i18n.js used to exist as a stale duplicate; bots have edited it
        # in good faith and shipped non-functional commits. Keep it gone.
        run: |
          if [ -f i18n.js ]; then
            echo "::error::Top-level i18n.js was re-created. The only live i18n file is backend/public/shared/i18n.js — delete the duplicate."
            exit 1
          fi

      - name: Validate i18n.js syntax
        run: node --check public/shared/i18n.js
        working-directory: backend

      - name: Check i18n.js script paths in HTML
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const PUBLIC = path.resolve('public');
          const errors = [];
          (function walk(dir) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const f = path.join(dir, e.name);
              if (e.isDirectory()) { walk(f); continue; }
              if (!e.name.endsWith('.html')) continue;
              const html = fs.readFileSync(f, 'utf8');
              for (const m of html.matchAll(/<script\s+src=[\"']([^\"']*i18n\.js[^\"']*)[\"']/g)) {
                const src = m[1].split('?')[0];
                const resolved = src.startsWith('/')
                  ? path.join(PUBLIC, src)
                  : path.join(path.dirname(f), src);
                if (!fs.existsSync(resolved))
                  errors.push(path.relative(PUBLIC, f) + ': bad path \"' + m[1] + '\"');
              }
            }
          })(PUBLIC);
          if (errors.length) { console.error('Invalid i18n.js paths:\n  ' + errors.join('\n  ')); process.exit(1); }
          console.log('✅ All i18n.js paths valid');
          "
        working-directory: backend

      - name: Strict i18n reference check (hard-fail on missing EN keys)
        # Every `data-i18n` / `data-i18n-title` / `data-i18n-placeholder`
        # attribute and every `i18n.t('key')` call in backend/public/**
        # must resolve in TRANSLATIONS.en. A missing key means the UI
        # renders the raw key string — the exact "i18n not defined" class
        # of low-level bug this gate exists to prevent.
        # Also reports per-locale coverage (warn-only; EN fallback at runtime
        # keeps missing non-EN keys from breaking the UI).
        run: node scripts/i18n-check.js
        working-directory: backend

  # ── Jest + Supertest ────────────────────────────────────────────────────────
  jest:
    name: Jest unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run Jest tests
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          # No DATABASE_URL → backend falls back to file storage (mocked in tests)

  # ── Railway Preview Deploy ──────────────────────────────────────────────────
  preview:
    name: Deploy preview to Railway
    runs-on: ubuntu-latest
    needs: [lint, i18n, jest]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy preview environment
        id: deploy
        continue-on-error: true
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --environment pr-${{ github.event.number }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Comment preview URL on PR
        if: steps.deploy.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚂 Railway preview deployed for PR #${{ github.event.number }}. Check the Railway dashboard for the preview URL.'
            })
