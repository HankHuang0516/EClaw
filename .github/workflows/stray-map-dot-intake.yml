name: Stray Map official dot photo intake

on:
  push:
    branches: [codex/stray-map-intake-rehearsal-20261126]
    paths: [.github/workflows/stray-map-dot-intake.yml]

permissions: {}

jobs:
  identity:
    name: Verify official identity (read only)
    if: github.actor_id == '96640428' && github.triggering_actor == 'HankHuang0516'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test tools/stray-map-pilot/dot-identity.test.cjs
      - if: github.run_attempt == '1'
        run: node tools/stray-map-pilot/dot-submit.cjs verify-photo
      - if: github.run_attempt != '1'
        run: node tools/stray-map-pilot/dot-submit.cjs probe-photo

  source:
    name: Check official photo source (read only)
    if: github.actor_id == '96640428' && github.triggering_actor == 'HankHuang0516'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node tools/stray-map-pilot/dot-submit.cjs check-photo-source
