name: Android CI

# Lint + debug build for the Android app.
# Instrumented tests require a real device/emulator — they are run separately
# (see the instrumented-test job below, disabled by default in CI).

on:
  push:
    branches: ['**']
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/android-ci.yml'

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -euo pipefail
          git init "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Create dummy google-services.json for CI
        run: |
          cat > app/google-services.json << 'GSEOF'
          {"project_info":{"project_number":"000000000000","project_id":"dummy-ci","storage_bucket":"dummy-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.hank.clawlive"}},"api_key":[{"current_key":"dummy-key-for-ci"}]}],"configuration_version":"1"}
          GSEOF

      - name: Configure JDK 17
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_17_X64:-}" && -x "${JAVA_HOME_17_X64:-}/bin/java" ]]; then
            JAVA17_HOME="${JAVA_HOME_17_X64}"
          elif [[ -x "/usr/lib/jvm/temurin-17-jdk-amd64/bin/java" ]]; then
            JAVA17_HOME="/usr/lib/jvm/temurin-17-jdk-amd64"
          elif [[ -x "/usr/lib/jvm/java-17-openjdk-amd64/bin/java" ]]; then
            JAVA17_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          else
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk
            JAVA17_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          fi
          echo "JAVA_HOME=${JAVA17_HOME}" >> "${GITHUB_ENV}"
          echo "${JAVA17_HOME}/bin" >> "${GITHUB_PATH}"
          "${JAVA17_HOME}/bin/java" -version

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  # ── Debug Build ─────────────────────────────────────────────────────────────
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -euo pipefail
          git init "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Create dummy google-services.json for CI
        run: |
          cat > app/google-services.json << 'GSEOF'
          {"project_info":{"project_number":"000000000000","project_id":"dummy-ci","storage_bucket":"dummy-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.hank.clawlive"}},"api_key":[{"current_key":"dummy-key-for-ci"}]}],"configuration_version":"1"}
          GSEOF

      - name: Configure JDK 17
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_17_X64:-}" && -x "${JAVA_HOME_17_X64:-}/bin/java" ]]; then
            JAVA17_HOME="${JAVA_HOME_17_X64}"
          elif [[ -x "/usr/lib/jvm/temurin-17-jdk-amd64/bin/java" ]]; then
            JAVA17_HOME="/usr/lib/jvm/temurin-17-jdk-amd64"
          elif [[ -x "/usr/lib/jvm/java-17-openjdk-amd64/bin/java" ]]; then
            JAVA17_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          else
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk
            JAVA17_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          fi
          echo "JAVA_HOME=${JAVA17_HOME}" >> "${GITHUB_ENV}"
          echo "${JAVA17_HOME}/bin" >> "${GITHUB_PATH}"
          "${JAVA17_HOME}/bin/java" -version

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ── Unit Tests ───────────────────────────────────────────────────────────────
  unit-test:
    name: Kotlin Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -euo pipefail
          git init "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Create dummy google-services.json for CI
        run: |
          cat > app/google-services.json << 'GSEOF'
          {"project_info":{"project_number":"000000000000","project_id":"dummy-ci","storage_bucket":"dummy-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.hank.clawlive"}},"api_key":[{"current_key":"dummy-key-for-ci"}]}],"configuration_version":"1"}
          GSEOF

      - name: Configure JDK 17
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_17_X64:-}" && -x "${JAVA_HOME_17_X64:-}/bin/java" ]]; then
            JAVA17_HOME="${JAVA_HOME_17_X64}"
          elif [[ -x "/usr/lib/jvm/temurin-17-jdk-amd64/bin/java" ]]; then
            JAVA17_HOME="/usr/lib/jvm/temurin-17-jdk-amd64"
          elif [[ -x "/usr/lib/jvm/java-17-openjdk-amd64/bin/java" ]]; then
            JAVA17_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          else
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk
            JAVA17_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          fi
          echo "JAVA_HOME=${JAVA17_HOME}" >> "${GITHUB_ENV}"
          echo "${JAVA17_HOME}/bin" >> "${GITHUB_PATH}"
          "${JAVA17_HOME}/bin/java" -version

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

  # ── Instrumented Tests (emulator) ───────────────────────────────────────────
  # Disabled by default — requires AVD setup (slow, uses API credits).
  # Enable by setting the repository variable RUN_INSTRUMENTED_TESTS=true.
  instrumented-test:
    name: Instrumented Tests (emulator)
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_INSTRUMENTED_TESTS == 'true' }}
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -euo pipefail
          git init "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --force FETCH_HEAD
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Create dummy google-services.json for CI
        run: |
          cat > app/google-services.json << 'GSEOF'
          {"project_info":{"project_number":"000000000000","project_id":"dummy-ci","storage_bucket":"dummy-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.hank.clawlive"}},"api_key":[{"current_key":"dummy-key-for-ci"}]}],"configuration_version":"1"}
          GSEOF

      - name: Configure JDK 17
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${JAVA_HOME_17_X64:-}" && -x "${JAVA_HOME_17_X64:-}/bin/java" ]]; then
            JAVA17_HOME="${JAVA_HOME_17_X64}"
          elif [[ -x "/usr/lib/jvm/temurin-17-jdk-amd64/bin/java" ]]; then
            JAVA17_HOME="/usr/lib/jvm/temurin-17-jdk-amd64"
          elif [[ -x "/usr/lib/jvm/java-17-openjdk-amd64/bin/java" ]]; then
            JAVA17_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          else
            sudo apt-get update
            sudo apt-get install -y openjdk-17-jdk
            JAVA17_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          fi
          echo "JAVA_HOME=${JAVA17_HOME}" >> "${GITHUB_ENV}"
          echo "${JAVA17_HOME}/bin" >> "${GITHUB_PATH}"
          "${JAVA17_HOME}/bin/java" -version

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumented test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/connected/
