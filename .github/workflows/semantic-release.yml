name: Semantic Release

# Automatically analyzes commits on main, bumps version, and creates
# a GitHub Release (tag + release notes). Per #6 ruling Path A
# (2026-06-14), this workflow no longer pushes a release commit back
# to main — branch protection blocks @semantic-release/git, and
# GitHub Releases are the system of record. CHANGELOG.md is not
# regenerated; release notes live on the Releases page.
#
# Commit message convention (Angular preset):
#   feat: add feature          → minor bump (1.x.0)
#   fix: fix bug               → patch bump (1.0.x)
#   feat!: breaking change     → major bump (x.0.0)
#   BREAKING CHANGE: ...       → major bump
#   docs/style/refactor/test/chore → no release
#
# Required secrets:
#   GITHUB_TOKEN — automatically provided by GitHub Actions (no setup needed)

on:
  push:
    branches: [main]
    # Only run when code actually changes (not on release commits themselves)
    paths-ignore:
      - 'CHANGELOG.md'
      - 'release_v*/**'

concurrency:
  group: semantic-release
  cancel-in-progress: false   # queue runs; never cancel — every release must complete

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Skip release commits created by semantic-release itself
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    permissions:
      contents: write      # create tags + GitHub Releases
      issues: write        # close issues referenced in commits
      pull-requests: write # comment on PRs

    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -euo pipefail
          git init "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Fetch full history and tags so semantic-release can analyze all commits.
          git fetch --force --prune --prune-tags --tags origin "+${GITHUB_REF}:refs/remotes/origin/main"
          git checkout --force -B main "${GITHUB_SHA}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Verify Node.js
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const major = Number(process.versions.node.split('.')[0]); if (major < 20) throw new Error('Node.js 20+ is required')"

      - name: Install semantic-release + plugins
        run: |
          npm install --no-save \
            semantic-release@24 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/release-notes-generator@14 \
            @semantic-release/github@10

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GIT_AUTHOR_NAME / GIT_COMMITTER_NAME for the release commit
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: 'github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: 'github-actions[bot]@users.noreply.github.com'
