name: Dream Buddy inference transactions
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/dream-buddy-inference-ci.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/dream-buddy-inference-ci.yml']
permissions:
  contents: read
jobs:
  postgres:
    name: Dream Buddy inference PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dream_buddy_inference_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DREAM_BUDDY_TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/dream_buddy_inference_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npx jest --runInBand tests/jest/dream-buddy-inference.postgres.test.js tests/jest/dream-buddy-minimax-worker.test.js
        working-directory: backend
