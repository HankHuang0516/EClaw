[package]
name = "eclaw-desktop"
version = "0.1.0"
edition = "2021"

# Canonical Tauri 2 desktop+mobile layout: main.rs (bin) calls
# eclaw_desktop_lib::run() from this lib. Without an explicit [lib] name the
# auto lib is `eclaw_desktop`, so main.rs fails to link AND the command macros
# get compiled twice (E0255 `__cmd__*` defined multiple times). This section is
# what `tauri init` generates; its absence was the root cause.
[lib]
name = "eclaw_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "net"] }
# OAuth (P1-B)
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "blocking"] }
urlencoding = "2"

# State management
parking_lot = "0.12"

# Platform utilities
dirs = "5"
hostname = "0.4"

# Windows Credential Manager
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Credentials",
    "Win32_Foundation",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
