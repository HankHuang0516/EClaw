[package]
name = "eclaw-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "net"] }
rustc-version = "0.4"

# OAuth / PKCE
rand = "0.8"
sha2 = "0.10"
base64 = "0.13"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"

# Global mutable state
parking_lot = "0.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
