[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eclaw-mobile-use-driver"
version = "0.1.0"
description = "EclawController(MobileDeviceController) plugin — drive any EClaw device from minitap-ai/mobile-use."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "EClawbot", email = "twopiggyhavefun@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
mobile-use = [
  # Pinned to the upstream Protocol interface verified for M2.
  "mobile-use>=3.3.0",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/HankHuang0516/EClaw/tree/main/eclaw-mobile-use-driver"
Spec = "https://github.com/HankHuang0516/EClaw/blob/main/docs/specs/mobile-use-integration.md"
Upstream = "https://github.com/minitap-ai/mobile-use"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eclaw_mobile_use_driver = ["py.typed"]
