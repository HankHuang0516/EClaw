<header class="top">
  <a class="brand" href="#overview" aria-label="AiHankApps 管理中樞，回到總覽"><span class="brand-mark">H</span><span class="brand-name">AiHankApps</span><span class="brand-sub">管理中樞</span></a>

    <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg><span>搜尋 APP、指標、功能</span><kbd id="kbd-hint">⌘K</kbd>
  </button>
  <div class="top-r">

    <button type="button" class="icon-btn" id="theme-btn" data-act="theme" aria-label="切換深色或淺色" title="切換深色或淺色（快速鍵 t）"><svg class="ico" aria-hidden="true"><use href="#i-moon" id="theme-ico"/></svg></button>

</header>

</div>
