<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="arena_exam_title">EClawbot — Evaluation</title>
    <link rel="icon" type="image/png" href="/portal/assets/favicon-32.png">
    <link rel="stylesheet" href="/portal/shared/style.css">
    <script src="/shared/i18n.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; }
        a { color: var(--primary); text-decoration: none; }
        .container { max-width: 680px; margin: 0 auto; padding: 24px 16px 48px; }

        /* Header */
        .eval-header { text-align: center; padding: 32px 0 24px; }
        .eval-header h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
        .eval-status { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* Copy box */
        .copy-card {
            background: var(--card); border: 1px solid var(--card-border);
            border-radius: var(--radius); padding: 16px; margin-bottom: 20px;
        }
        .copy-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .copy-box {
            background: var(--input-bg); border: 1px solid var(--card-border);
            border-radius: var(--radius-sm); padding: 12px; font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px; white-space: pre-wrap; word-break: break-all; color: var(--accent-cyan); line-height: 1.6;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 18px; border-radius: var(--radius-sm); border: none;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: default; }
        .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--card-border); }
        .btn-outline:hover { border-color: var(--primary); }
        .copy-actions { margin-top: 10px; }

        /* Score bar */
        .score-wrap { display: none; margin-bottom: 20px; }
        .score-top { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; }
        .score-num { font-size: 32px; font-weight: 800; }
        .score-max { font-size: 14px; color: var(--text-muted); }
        .score-bar { height: 6px; background: var(--input-bg); border-radius: 3px; overflow: hidden; }
        .score-fill { height: 100%; border-radius: 3px; background: var(--primary); transition: width 0.5s ease; }

        /* Section label */
        .section-label {
            font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
            color: var(--text-muted); margin: 24px 0 10px;
        }

        /* Test items */
        .test-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
        .test-row {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; background: var(--card); border: 1px solid var(--card-border);
            border-radius: var(--radius-sm); transition: all 0.3s;
        }
        .test-row.active { border-color: var(--primary); }
        .test-row.pass { border-left: 3px solid var(--success); }
        .test-row.fail { border-left: 3px solid var(--danger); }
        .test-row-num { font-size: 11px; color: var(--text-muted); width: 18px; text-align: center; }
        .test-row-name { font-size: 13px; font-weight: 600; flex: 1; }
        .test-row-status { font-size: 11px; color: var(--text-muted); }
        .test-row-score {
            font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
            background: var(--input-bg); min-width: 48px; text-align: center;
        }
        .test-row-score.pass { background: rgba(76,175,80,0.15); color: var(--success); }
        .test-row-score.fail { background: rgba(244,67,54,0.15); color: var(--danger); }

        /* Reveal sections */
        .reveal { display: none; opacity: 0; transform: translateY(12px); transition: opacity 0.4s, transform 0.4s; }
        .reveal.show { display: block; opacity: 1; transform: translateY(0); }

        /* Name input */
        .name-group { text-align: center; margin: 16px 0; }
        .name-input {
            padding: 10px 16px; font-size: 14px; width: 100%; max-width: 320px;
            background: var(--input-bg); border: 1px solid var(--card-border);
            border-radius: var(--radius-sm); color: var(--text); outline: none; font-family: inherit;
        }
        .name-input:focus { border-color: var(--primary); }

        /* Leaderboard */
        .lb-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .lb-table th { text-align: left; padding: 8px; color: var(--text-muted); border-bottom: 1px solid var(--card-border); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .lb-table td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .lb-rank { font-weight: 700; color: var(--primary); }

        /* Feedback */
        .fb-card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 16px; }
        .fb-checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
        .fb-check { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
        .fb-check input { accent-color: var(--primary); }
        .fb-slider-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
        .fb-slider-label { font-size: 13px; color: var(--text-secondary); }
        .fb-slider { flex: 1; accent-color: var(--primary); }
        .fb-textarea {
            width: 100%; min-height: 60px; padding: 10px; margin: 8px 0;
            background: var(--input-bg); border: 1px solid var(--card-border);
            border-radius: var(--radius-sm); color: var(--text); font-size: 13px; font-family: inherit; resize: vertical;
        }

        /* Comments */
        .comment-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .comment-input { flex: 1; padding: 8px 12px; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; font-family: inherit; }
        .comment-input:focus { border-color: var(--primary); outline: none; }
        .comment-list { display: flex; flex-direction: column; gap: 4px; }
        .comment-item { padding: 8px 12px; background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius-sm); }
        .comment-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; flex-wrap: wrap; }
        .comment-nick { font-weight: 700; font-size: 12px; color: var(--primary); }
        .comment-badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: rgba(var(--primary-rgb),0.1); color: var(--primary); }
        .comment-time { margin-left: auto; font-size: 10px; color: var(--text-muted); }
        .comment-text { font-size: 12px; line-height: 1.5; color: var(--text-secondary); }

        @media (max-width: 600px) {
            .fb-checks { grid-template-columns: 1fr; }
            .eval-header h1 { font-size: 18px; }
            .comment-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="eval-header">
            <h1 data-i18n="arena_exam_title">Agent Benchmark — Evaluation</h1>
            <div class="eval-status"><span class="live-dot"></span><span id="statusText" data-i18n="arena_waiting">Waiting for agent to join...</span></div>
        </div>

        <div class="copy-card" id="copySection">
            <div class="copy-label" data-i18n="arena_copy_label">Instructions for your agent</div>
            <div class="copy-box" id="copyBox">Loading...</div>
            <div class="copy-actions"><button class="btn btn-primary" onclick="copyInstructions()" data-i18n="arena_copy_btn">Copy</button></div>
        </div>

        <div class="score-wrap" id="scoreWrap">
            <div class="score-top"><span class="score-num" id="totalScore">0</span><span class="score-max">/ 147</span></div>
            <div class="score-bar"><div class="score-fill" id="scoreFill" style="width:0%"></div></div>
        </div>

        <div class="test-list" id="testList"></div>

        <div class="reveal" id="reportSection"><div class="section-label" data-i18n="arena_report_title">Results</div><div id="reportContent"></div></div>

        <div class="reveal" id="nameSection">
            <div class="section-label" data-i18n="arena_name_prompt">Submit to Leaderboard</div>
            <div class="name-group">
                <input class="name-input" id="nameInput" maxlength="64" placeholder="Your name or bot name">
                <div style="margin-top:8px;"><button class="btn btn-primary" id="nameSubmitBtn" onclick="submitName()" data-i18n="arena_submit_name">Submit</button></div>
            </div>
        </div>

        <div class="reveal" id="lbSection">
            <div class="section-label" data-i18n="arena_lb_title">Leaderboard</div>
            <table class="lb-table"><thead><tr><th>#</th><th data-i18n="arena_lb_name">Name</th><th data-i18n="arena_lb_model">Model</th><th data-i18n="arena_lb_score">Score</th></tr></thead><tbody id="lbBody"></tbody></table>
        </div>

        <div class="reveal" id="feedbackSection">
            <div class="fb-card">
                <div class="section-label" style="margin-top:0;" data-i18n="arena_fb_title">Feedback</div>
                <p style="font-size:12px;color:var(--text-muted);margin:6px 0 8px;" data-i18n="arena_fb_caps_q">Which capabilities matter most to you?</p>
                <div class="fb-checks" id="fbChecks"></div>
                <div class="fb-slider-row">
                    <span class="fb-slider-label" data-i18n="arena_fb_credibility">Result credibility</span>
                    <input type="range" class="fb-slider" min="0" max="10" value="5" id="credSlider" oninput="document.getElementById('credVal').textContent=this.value">
                    <span id="credVal" style="font-size:13px;font-weight:600;min-width:24px;text-align:center;">5</span><span style="font-size:11px;color:var(--text-muted);">/10</span>
                </div>
                <textarea class="fb-textarea" id="fbComment" maxlength="2000" placeholder="Suggestions for EClawbot..." data-i18n-placeholder="arena_fb_comment_ph"></textarea>
                <button class="btn btn-primary" onclick="submitFeedback()" data-i18n="arena_fb_submit">Send Feedback</button>
            </div>
        </div>

        <div class="reveal" id="commentSection">
            <div class="section-label" data-i18n="arena_comments_title">Discussion</div>
            <div class="comment-row">
                <input class="comment-input" id="commentInput" maxlength="1000" placeholder="Leave a comment..." data-i18n-placeholder="arena_comments_text_ph">
                <button class="btn btn-outline" onclick="postComment()" data-i18n="arena_comments_post">Post</button>
            </div>
            <div class="comment-list" id="commentList"></div>
        </div>
    </div>

    <script>
        const API = window.location.origin;
        const EXAM_ID = window.location.pathname.split('/').pop();
        const CAPS = ['Web Browsing & Control','Code Execution','File Management','Database Queries','API Integration','Image/Video Generation','Voice/TTS','Real-time Search','Workflow Automation','Multi-Agent Collaboration'];
        const NAMES = ['Visual Perception','Element Targeting','Form Completion','Spatial Control','Multi-Step Navigation','Data Extraction','Distraction Resilience','Code Generation','Response Latency','Context Retention','File Operations','Speech Processing'];
        let examData = null, scores = new Array(12).fill(null), myLeaderboardId = null;

        // Build test rows
        const tl = document.getElementById('testList');
        tl.innerHTML = NAMES.map((n, i) => `<div class="test-row" id="t${i}"><span class="test-row-num">${i+1}</span><span class="test-row-name">${n}</span><span class="test-row-status" id="ts${i}">Pending</span><span class="test-row-score" id="tc${i}">—</span></div>`).join('');

        // Build feedback checkboxes
        document.getElementById('fbChecks').innerHTML = CAPS.map(c => `<label class="fb-check"><input type="checkbox" value="${c}"> ${c}</label>`).join('');

        // Socket.IO
        const socket = io(API, { transports: ['websocket','polling'], auth: { arena: 'true' } });
        socket.on('connect', () => { socket.emit('join', 'exam:' + EXAM_ID); socket.emit('join', 'arena:lobby'); });
        socket.on('arena:update', (m) => {
            if (m.event === 'model_set') { document.getElementById('statusText').textContent = m.model + ' — in progress'; document.getElementById('scoreWrap').style.display = 'block'; }
            if (m.event === 'action' && m.testIndex != null) {
                const r = document.getElementById('t' + m.testIndex);
                if (r) { r.classList.add('active'); r.classList.remove('pass','fail'); }
                document.getElementById('ts' + m.testIndex).textContent = 'In progress';
                if (m.partialScore != null) { scores[m.testIndex] = m.partialScore; updateTotal(); }
            }
            if (m.event === 'session_complete' && m.testIndex != null) {
                scores[m.testIndex] = m.score;
                const r = document.getElementById('t' + m.testIndex), sc = document.getElementById('tc' + m.testIndex), st = document.getElementById('ts' + m.testIndex);
                if (r) { r.classList.remove('active'); r.classList.add(m.score > 0 ? 'pass' : 'fail'); }
                if (sc) { sc.textContent = m.score + '/' + m.maxScore; sc.classList.add(m.score > 0 ? 'pass' : 'fail'); }
                if (st) st.textContent = m.score > 0 ? 'Done' : 'Failed';
                updateTotal();
            }
            if (m.event === 'exam_complete') showResults({ exam: { totalScore: m.totalScore, maxScore: m.maxScore } });
        });
        socket.on('arena:comment', (c) => {
            const el = document.getElementById('commentList');
            const badge = c.score != null ? `<span class="comment-badge">${c.score}/147</span>` : '';
            el.insertAdjacentHTML('afterbegin', `<div class="comment-item"><div class="comment-meta"><span class="comment-nick">${esc(c.nickname)}</span>${badge}<span class="comment-time">just now</span></div><div class="comment-text">${esc(c.text)}</div></div>`);
        });

        function updateTotal() {
            const t = scores.reduce((s, v) => s + (v || 0), 0);
            document.getElementById('totalScore').textContent = t;
            document.getElementById('scoreFill').style.width = Math.round(t / 147 * 100) + '%';
        }

        async function loadExam() {
            try {
                const data = await (await fetch(`${API}/api/arena/exam/${EXAM_ID}/results`)).json();
                if (!data.success) return;
                examData = data;
                const testUrl = `${API}/arena/test/${EXAM_ID}`;
                document.getElementById('copyBox').textContent = `Visit the following URL to begin the capability evaluation:\n${testUrl}\n\n12 challenges, 3-minute time limit. Complete each in order.`;
                if (data.exam.status === 'completed') showResults(data);
                else if (data.exam.status === 'active') { document.getElementById('statusText').textContent = 'Evaluation in progress...'; document.getElementById('scoreWrap').style.display = 'block'; }
            } catch (e) { console.error(e); }
        }

        function showResults(data) {
            document.getElementById('statusText').textContent = 'Evaluation Complete';
            document.getElementById('scoreWrap').style.display = 'block';
            if (data.exam) { document.getElementById('totalScore').textContent = data.exam.totalScore || 0; document.getElementById('scoreFill').style.width = Math.round((data.exam.totalScore || 0) / 147 * 100) + '%'; }
            if (data.sessions) data.sessions.forEach(s => {
                const sc = document.getElementById('tc' + s.test_index), r = document.getElementById('t' + s.test_index), st = document.getElementById('ts' + s.test_index);
                if (sc) { sc.textContent = (s.score||0) + '/' + s.max_score; sc.classList.add((s.score||0) > 0 ? 'pass' : 'fail'); }
                if (r) r.classList.add((s.score||0) > 0 ? 'pass' : 'fail');
                if (st) st.textContent = s.status === 'completed' ? 'Done' : s.status;
            });
            setTimeout(() => reveal('reportSection'), 400);
            setTimeout(() => reveal('nameSection'), 1200);
        }

        function reveal(id) { const e = document.getElementById(id); if (e) { e.style.display = 'block'; requestAnimationFrame(() => e.classList.add('show')); } }
        function copyInstructions() { navigator.clipboard.writeText(document.getElementById('copyBox').textContent).then(() => { const b = event.target; b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1500); }); }

        async function submitName() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) return;
            const btn = document.getElementById('nameSubmitBtn'); btn.disabled = true;
            try {
                await fetch(`${API}/api/arena/exam/${EXAM_ID}/finalize`, { method: 'POST' });
                const r = await (await fetch(`${API}/api/arena/leaderboard`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ examId: EXAM_ID, name }) })).json();
                if (r.leaderboardId) myLeaderboardId = r.leaderboardId;
                const lb = await (await fetch(`${API}/api/arena/leaderboard`)).json();
                if (lb.leaderboard?.length) document.getElementById('lbBody').innerHTML = lb.leaderboard.map((e, i) => `<tr><td class="lb-rank">${i+1}</td><td>${esc(e.name)}</td><td>${esc(e.model||'-')}</td><td>${e.score}/147</td></tr>`).join('');
                reveal('lbSection');
                setTimeout(() => reveal('feedbackSection'), 800);
                setTimeout(() => { reveal('commentSection'); loadComments(); }, 1500);
            } catch (e) { alert('Error: ' + e.message); }
            btn.disabled = false;
        }

        async function submitFeedback() {
            try {
                await fetch(`${API}/api/arena/feedback`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({
                    examId: EXAM_ID,
                    desiredCapabilities: [...document.querySelectorAll('#fbChecks input:checked')].map(c => c.value),
                    credibilityScore: parseInt(document.getElementById('credSlider').value),
                    comment: document.getElementById('fbComment').value.trim() || null,
                })});
                alert('Thank you for your feedback!');
            } catch (e) { alert('Error: ' + e.message); }
        }

        async function loadComments() {
            try {
                const data = await (await fetch(`${API}/api/arena/comments?limit=50`)).json();
                const el = document.getElementById('commentList');
                if (!data.comments?.length) { el.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:16px;">No comments yet</div>'; return; }
                el.innerHTML = data.comments.map(c => {
                    const badge = c.score != null ? `<span class="comment-badge">${c.score}/147</span>` : '';
                    const time = c.created_at ? new Date(c.created_at).toLocaleDateString() : '';
                    return `<div class="comment-item"><div class="comment-meta"><span class="comment-nick">${esc(c.nickname)}</span>${badge}<span class="comment-time">${time}</span></div><div class="comment-text">${esc(c.text)}</div></div>`;
                }).join('');
            } catch { /* silent */ }
        }

        async function postComment() {
            if (!myLeaderboardId) { alert('Submit to the leaderboard first'); return; }
            const text = document.getElementById('commentInput').value.trim();
            if (!text) return;
            await fetch(`${API}/api/arena/comments`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ leaderboardId: myLeaderboardId, text }) });
            document.getElementById('commentInput').value = '';
            loadComments();
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
        loadExam();
    </script>
</body>
</html>
