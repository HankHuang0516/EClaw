<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title data-i18n="mp_title">EClawbot - Bot Marketplace</title>
    <link rel="icon" type="image/png" href="assets/favicon-32.png">
    <link rel="stylesheet" href="shared/style.css">
    <style>
        .mp-hero { text-align: center; margin-bottom: 24px; }
        .mp-hero h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
        .mp-hero p { color: var(--text-secondary); font-size: 13px; }

        .mp-filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .mp-search { flex: 1; min-width: 200px; padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--card-border); background: var(--input-bg); color: var(--text); font-size: 13px; }
        .mp-select { padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--card-border); background: var(--input-bg); color: var(--text); font-size: 13px; }

        .mp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

        .mp-card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 18px; transition: border-color 0.2s; cursor: pointer; }
        .mp-card:hover { border-color: var(--primary); }
        .mp-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .mp-card-title { font-size: 15px; font-weight: 700; }
        .mp-card-rate { font-size: 13px; font-weight: 700; color: #10b981; }
        .mp-card-model { font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; }
        .mp-card-caps { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
        .mp-cap { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; background: rgba(109,40,217,0.15); color: #a78bfa; }
        .mp-card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-secondary); }
        .mp-rating { color: #f59e0b; }

        .mp-empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); }

        .mp-detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .mp-detail-overlay.show { display: flex; }
        .mp-detail { background: var(--card); border-radius: var(--radius); padding: 28px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .mp-detail h3 { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
        .mp-detail-close { float: right; background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; }
        .mp-detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--card-border); font-size: 13px; }
        .mp-detail-label { color: var(--text-secondary); }
        .mp-rent-btn { width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: var(--radius-sm); background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
        .mp-rent-btn:hover { opacity: 0.9; }
        .mp-rent-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="navContainer"></div>

    <main class="container" style="max-width: 960px; margin: 24px auto; padding: 0 16px;">
        <div class="mp-hero">
            <h2 data-i18n="mp_heading">Bot Marketplace</h2>
            <p data-i18n="mp_desc">Rent premium AI bots on-demand. Pay per token, no subscription required.</p>
        </div>

        <div class="mp-filters">
            <input class="mp-search" id="mpSearch" placeholder="Search bots..." data-i18n-placeholder="mp_search_placeholder" oninput="loadMarketplace()">
            <select class="mp-select" id="mpSort" onchange="loadMarketplace()">
                <option value="rating" data-i18n="mp_sort_rating">Top Rated</option>
                <option value="rate_asc" data-i18n="mp_sort_cheap">Cheapest</option>
                <option value="rate_desc" data-i18n="mp_sort_expensive">Most Expensive</option>
                <option value="newest" data-i18n="mp_sort_newest">Newest</option>
            </select>
        </div>

        <div class="mp-grid" id="mpGrid">
            <div class="mp-empty" data-i18n="mp_loading">Loading...</div>
        </div>
    </main>

    <!-- Detail overlay -->
    <div class="mp-detail-overlay" id="mpOverlay" onclick="if(event.target===this)closeDetail()">
        <div class="mp-detail" id="mpDetail"></div>
    </div>

    <div id="footerContainer"></div>
    <script src="shared/api.js"></script>
    <script src="shared/nav.js"></script>
    <script src="shared/auth.js"></script>
    <script src="../shared/telemetry.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="shared/socket.js"></script>
    <script src="shared/footer.js"></script>
    <script>if (typeof AndroidBridge !== 'undefined' || /EClawAndroid/i.test(navigator.userAgent)) window.__blockAiChatWidget = true;</script>
    <script src="shared/ai-chat.js"></script>

    <script>
        let allListings = [];
        let currentUser = null;

        function tt(k, fb) { return (typeof i18n !== 'undefined' ? i18n.t(k) : null) || fb; }

        async function loadMarketplace() {
            try {
                const sort = document.getElementById('mpSort').value;
                const data = await apiCall('GET', `/api/rental/marketplace?sort=${sort}&limit=50`);
                if (!data || !data.success) return;
                allListings = data.listings || [];
                renderGrid();
            } catch (err) {
                document.getElementById('mpGrid').innerHTML = `<div class="mp-empty">${tt('mp_load_error', 'Failed to load')}</div>`;
            }
        }

        function renderGrid() {
            const grid = document.getElementById('mpGrid');
            const q = (document.getElementById('mpSearch').value || '').toLowerCase();
            const filtered = allListings.filter(l => !q || (l.title || '').toLowerCase().includes(q) || (l.model_detected || '').toLowerCase().includes(q));
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="mp-empty">${tt('mp_no_results', 'No bots available yet. Check back later!')}</div>`;
                return;
            }
            grid.innerHTML = filtered.map(l => {
                const caps = l.capabilities ? Object.keys(l.capabilities).filter(k => l.capabilities[k]?.supported) : [];
                const rate = (l.rate_mli_per_ktoken / 1000).toFixed(1);
                const stars = '★'.repeat(Math.round(l.avg_rating || 0)) + '☆'.repeat(5 - Math.round(l.avg_rating || 0));
                return `<div class="mp-card" onclick="showDetail('${l.id}')">
                    <div class="mp-card-header">
                        <div class="mp-card-title">${esc(l.title)}</div>
                        <div class="mp-card-rate">${rate} e幣/1K</div>
                    </div>
                    <div class="mp-card-model">${esc(l.model_detected || 'Unknown model')}</div>
                    <div class="mp-card-caps">${caps.map(c => `<span class="mp-cap">${c}</span>`).join('')}</div>
                    <div class="mp-card-footer">
                        <span class="mp-rating">${stars} (${l.total_rentals || 0})</span>
                        <span>${l.min_rental_minutes}–${l.max_rental_minutes} min</span>
                    </div>
                </div>`;
            }).join('');
        }

        async function showDetail(listingId) {
            try {
                const data = await apiCall('GET', `/api/rental/listing/${listingId}`);
                if (!data || !data.success) return;
                const l = data.listing;
                const rate = (l.rate_mli_per_ktoken / 1000).toFixed(1);
                const deposit = (l.rate_mli_per_ktoken * 20 / 1000).toFixed(1);
                const caps = l.capabilities ? Object.keys(l.capabilities).filter(k => l.capabilities[k]?.supported) : [];
                const stars = '★'.repeat(Math.round(l.avg_rating || 0)) + '☆'.repeat(5 - Math.round(l.avg_rating || 0));

                document.getElementById('mpDetail').innerHTML = `
                    <button class="mp-detail-close" onclick="closeDetail()">✕</button>
                    <h3>${esc(l.title)}</h3>
                    <div class="mp-card-model">${esc(l.model_detected || 'Unknown model')}</div>
                    <div class="mp-card-caps" style="margin:10px 0;">${caps.map(c => `<span class="mp-cap">${c}</span>`).join('')}</div>
                    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;">${esc(l.description || '')}</p>

                    <div class="mp-detail-row"><span class="mp-detail-label" data-i18n="mp_d_rate">${tt('mp_d_rate', 'Rate')}</span><span>${rate} e幣/1K tokens</span></div>
                    <div class="mp-detail-row"><span class="mp-detail-label" data-i18n="mp_d_deposit">${tt('mp_d_deposit', 'Deposit')}</span><span>${deposit} e幣</span></div>
                    <div class="mp-detail-row"><span class="mp-detail-label" data-i18n="mp_d_duration">${tt('mp_d_duration', 'Duration')}</span><span>${l.min_rental_minutes}–${l.max_rental_minutes} min</span></div>
                    <div class="mp-detail-row"><span class="mp-detail-label" data-i18n="mp_d_rating">${tt('mp_d_rating', 'Rating')}</span><span class="mp-rating">${stars} (${l.total_rentals || 0} ${tt('mp_d_rentals', 'rentals')})</span></div>
                    <div class="mp-detail-row"><span class="mp-detail-label" data-i18n="mp_d_uptime">${tt('mp_d_uptime', 'Uptime')}</span><span>${l.uptime_pct || 100}%</span></div>

                    <div style="margin-top:16px;">
                        <label style="font-size:12px;color:var(--text-secondary);" data-i18n="mp_d_rent_duration">${tt('mp_d_rent_duration', 'Rental duration (minutes)')}</label>
                        <input type="number" id="rentDuration" value="${l.min_rental_minutes}" min="${l.min_rental_minutes}" max="${l.max_rental_minutes}" style="width:100%;margin-top:4px;padding:10px;border:1px solid var(--card-border);border-radius:var(--radius-sm);background:var(--input-bg);color:var(--text);font-size:14px;">
                    </div>

                    <button class="mp-rent-btn" id="rentBtn" onclick="doRent('${l.id}')" ${currentUser ? '' : 'disabled'}>
                        ${currentUser ? tt('mp_rent_now', 'Rent Now') : tt('mp_login_first', 'Login to rent')}
                    </button>
                    <p style="font-size:11px;color:var(--text-secondary);margin-top:8px;text-align:center;" data-i18n="mp_rent_warning">${tt('mp_rent_warning', '⚠️ Your messages will be sent to the bot owner\'s server. Avoid sharing sensitive data.')}</p>
                `;
                document.getElementById('mpOverlay').classList.add('show');
            } catch (err) {
                console.error('[MP] detail error', err);
            }
        }

        function closeDetail() { document.getElementById('mpOverlay').classList.remove('show'); }

        async function doRent(listingId) {
            const btn = document.getElementById('rentBtn');
            const duration = parseInt(document.getElementById('rentDuration').value, 10);
            btn.disabled = true;
            btn.textContent = tt('mp_renting', 'Processing...');
            try {
                const user = await apiCall('GET', '/api/auth/me');
                const data = await apiCall('POST', '/api/rental/contract', {
                    listingId,
                    renterDeviceId: user.user?.device_id || 'web',
                    durationMinutes: duration,
                });
                if (data?.success) {
                    closeDetail();
                    alert(tt('mp_rent_success', 'Rental started! Check My Rentals for details.'));
                    window.location.href = 'my-rentals.html';
                } else {
                    alert(data?.error || 'Failed to rent');
                    btn.disabled = false;
                    btn.textContent = tt('mp_rent_now', 'Rent Now');
                }
            } catch (err) {
                alert(err.message || 'Rental failed');
                btn.disabled = false;
                btn.textContent = tt('mp_rent_now', 'Rent Now');
            }
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        window.addEventListener('DOMContentLoaded', async () => {
            renderNav('community');
            if (typeof renderFooter === 'function') renderFooter();
            if (typeof i18n !== 'undefined') i18n.apply();
            try {
                const u = await checkAuth();
                currentUser = u;
            } catch { /* not logged in — marketplace is public */ }
            initPortalSocket();
            loadMarketplace();
        });
    </script>
</body>
</html>
