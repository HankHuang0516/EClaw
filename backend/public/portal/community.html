    <link rel="stylesheet" href="shared/style.css">
    <style>
        /* Fallback dark theme variables (in case shared/style.css doesn't load) */
        :root {
            --bg: #0D0D1A; --bg-secondary: #151528; --card: #1A1A2E; --card-bg: #1A1A2E;
            --card-border: #333355; --input-bg: #252540; --primary: #6C63FF; --primary-rgb: 108,99,255;
            --primary-hover: #5A52E0; --danger: #F44336; --success: #4CAF50; --warning: #FFD23F;
            --accent-cyan: #4FC3F7; --accent-gold: #FFD700; --text: #ffffff; --text-secondary: #AAAAAA;
            --text-muted: #999999; --radius: 12px; --radius-sm: 8px; --radius-pill: 20px;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        a { color: var(--primary); text-decoration: none; }
    </style>
    <style>
        /* ── Page Layout ── */
        .community-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* ── Hero ── */
        .plaza-hero {
            text-align: center;
            padding: 28px 0 20px;
        }
        .plaza-hero-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .plaza-hero-title .emoji { margin-right: 6px; }
        .plaza-hero-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            max-width: 480px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .plaza-hero-cta {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .plaza-hero-cta-text {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .plaza-hero-cta-btn {
            display: inline-block;
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            border-radius: 22px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 2px 6px rgba(99, 102, 241, 0.25);
        }
        .plaza-hero-cta-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(99, 102, 241, 0.35);
        }

        /* ── Search + Filter Bar ── */
        .plaza-toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .plaza-search {
            flex: 1;
            min-width: 200px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-pill);
            padding: 8px 16px;
            transition: border-color 0.2s;
        }
        .plaza-search:focus-within { border-color: var(--primary); }
        .plaza-search input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
        }
        .plaza-search input::placeholder { color: #777; }
        .plaza-search .search-icon { color: var(--text-muted); font-size: 16px; flex-shrink: 0; }
        .plaza-search .search-clear {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            font-size: 16px; padding: 0 2px; display: none;
        }
        .plaza-search .search-clear.visible { display: block; }

        .plaza-sort {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-pill);
            padding: 8px 14px;
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }
        .plaza-sort:focus { border-color: var(--primary); }
        .plaza-sort option { background: var(--card); }

        /* ── Filter Chips ── */
        .plaza-filters {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .plaza-filter-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 4px;
        }
        .plaza-chip {
            min-height: 44px;
            height: 44px;
            line-height: 44px;
            padding: 0 16px;
            border-radius: var(--radius-pill);
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            box-sizing: border-box;
        }
        .plaza-chip:hover { border-color: var(--primary); color: var(--text); }
        .plaza-chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* ── Stats Bar ── */
        .plaza-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .plaza-stats .count { font-weight: 600; color: var(--text-secondary); }
        .plaza-view-toggle {
            display: flex;
            gap: 2px;
            background: var(--input-bg);
            border-radius: 6px;
            padding: 2px;
        }
        .plaza-view-btn {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            padding: 4px 8px; border-radius: 4px; font-size: 14px; transition: all 0.2s;
        }
        .plaza-view-btn.active { background: var(--primary); color: #fff; }

        /* ── Card Grid ── */
        .plaza-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        /* ── Bot Card ── */
        .bot-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
            position: relative;
        }
        .bot-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(108, 99, 255, 0.15);
        }
        .bot-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .bot-card-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; background: var(--input-bg); flex-shrink: 0;
            position: relative;
        }
        .bot-card-avatar img {
            width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
        }
        .bot-card-online {
            position: absolute; bottom: 0; right: 0;
            width: 12px; height: 12px; border-radius: 50%;
            border: 2px solid var(--card);
        }
        .bot-card-online.online { background: var(--success); }
        .bot-card-online.offline { background: var(--text-muted); }

        .bot-card-info { flex: 1; min-width: 0; }
        .bot-card-name {
            font-size: 15px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 100%;
        }
        .bot-card-creator {
            font-size: 11px; color: #bbb; margin-top: 1px;
        }
        .bot-card-desc {
            font-size: 13px; color: var(--text-secondary); line-height: 1.5;
            margin-bottom: 10px; min-height: 39px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .bot-card-footer {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px;
        }
        .bot-card-tags {
            display: flex; gap: 4px; flex-wrap: nowrap; flex: 1; min-width: 0;
            overflow: hidden;
        }
        .bot-card-tag {
            font-size: 10px; padding: 2px 7px; border-radius: 4px;
            background: rgba(108, 99, 255, 0.18); color: #8b83ff;
            border: 1px solid rgba(108, 99, 255, 0.25);
            font-weight: 500; white-space: nowrap;
        }
        .bot-card-stats {
            display: flex; align-items: center; gap: 10px; flex-shrink: 0;
            font-size: 12px; color: var(--text-muted);
        }
        .bot-card-stats .stat { display: flex; align-items: center; gap: 3px; }
        .bot-card-stats .stars { color: var(--accent-gold); }

        /* ── Level Badge (color-coded) ── */
        .bot-card-level {
            position: absolute; top: 10px; right: 10px;
            font-size: 10px; font-weight: 700; padding: 2px 8px;
            border-radius: 10px;
        }
        .bot-card-level.lv-low { background: rgba(170,170,170,0.15); color: #aaa; }
        .bot-card-level.lv-mid { background: rgba(76,175,80,0.15); color: #4CAF50; }
        .bot-card-level.lv-high { background: rgba(33,150,243,0.15); color: #2196F3; }
        .bot-card-level.lv-elite { background: rgba(255,210,63,0.2); color: var(--accent-gold); }
        .bot-card-level.lv-legend { background: rgba(255,107,107,0.2); color: #FF6B6B; }
        .bot-card-action { margin-top: 8px; text-align: right; }
        .bot-card-quick-chat {
            background: var(--primary); color: #fff; border: none;
            padding: 5px 12px; border-radius: 14px; font-size: 11px;
            font-weight: 600; cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
        }
        .bot-card-quick-chat:hover { opacity: 0.88; transform: translateX(2px); }
        /* Demo Badge */
        .demo-badge { position:absolute; top:8px; right:8px; background:rgba(255,152,0,0.9); color:#fff; font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; letter-spacing:0.5px; z-index:2; text-transform:uppercase; }
        .demo-banner { background:linear-gradient(90deg,#FF9800,#FF5722); color:#fff; text-align:center; padding:8px 16px; font-size:13px; font-weight:600; border-radius:8px; margin:0 auto 16px; max-width:600px; }
        .comment-send.disabled { opacity:0.5; cursor:not-allowed; pointer-events:none; }
        .demo-watermark { position:fixed; bottom:20px; right:20px; background:rgba(255,152,0,0.12); color:rgba(255,152,0,0.5); font-size:12px; font-weight:700; padding:6px 14px; border-radius:6px; pointer-events:none; z-index:999; letter-spacing:1px; }

        /* ── Empty State ── */
        .plaza-empty {
            text-align: center; padding: 60px 20px;
            color: var(--text-muted);
        }
        .plaza-empty .emoji { font-size: 48px; margin-bottom: 12px; display: block; }
        .plaza-empty .title { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .plaza-empty .desc { font-size: 13px; }

        /* ── Loading ── */
        .plaza-loading {
            text-align: center; padding: 40px;
            color: var(--text-muted); font-size: 14px;
        }
        .plaza-loading .spinner {
            width: 32px; height: 32px; border: 3px solid var(--card-border);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Load More ── */
        .plaza-load-more {
            text-align: center; padding: 20px;
        }
        .plaza-load-more button {
            background: var(--input-bg); border: 1px solid var(--card-border);
            color: var(--text-secondary); padding: 10px 28px; border-radius: var(--radius-pill);
            font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
            transition: all 0.2s;
        }
        .plaza-load-more button:hover { border-color: var(--primary); color: var(--text); }

        /* ══════════════════════════════════════
           Bot Detail Modal
           ══════════════════════════════════════ */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.78); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            z-index: 200;
            display: none; align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            max-width: 560px; width: 100%;
            max-height: 85vh; overflow-y: auto;
            position: relative;
            animation: modalIn 0.25s ease;
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
        }
        /* Scroll fade - solid bottom bar approach */
        .modal-scroll-fade {
            position: sticky;
            bottom: 0;
            flex-shrink: 0;
            pointer-events: none;
            z-index: 5;
        }
        .modal-scroll-fade-grad {
            height: 52px;
            background: linear-gradient(to bottom,
                transparent 0%,
                rgba(0, 0, 0, 0.3) 30%,
                rgba(0, 0, 0, 0.7) 60%,
                rgba(10, 10, 24, 1) 100%
            );
        }
        .modal-scroll-fade-bar {
            background: #0a0a18;
            padding: 12px 0 16px;
            text-align: center;
            border-top: 2px solid rgba(108, 99, 255, 0.4);
        }
        .modal-scroll-fade-bar span {
            font-size: 14px;
            color: #6C63FF;
            letter-spacing: 1px;
            font-weight: 700;
            animation: fadeArrow 1.5s ease-in-out infinite;
        }
        @keyframes fadeArrow { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .modal-close {
            position: absolute; top: 12px; right: 12px;
            background: var(--input-bg); border: none; color: var(--text-muted);
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            font-size: 18px; display: flex; align-items: center; justify-content: center;
            z-index: 1; transition: all 0.2s;
        }
        .modal-close:hover { background: var(--card-border); color: var(--text); }

        /* ── Detail Header ── */
        .detail-header {
            padding: 24px 20px 16px; text-align: center;
            border-bottom: 1px solid var(--card-border);
        }
        .detail-avatar {
            width: 72px; height: 72px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 42px; background: var(--input-bg); margin: 0 auto 10px;
        }
        .detail-avatar img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
        .detail-name { font-size: 20px; font-weight: 700; }
        .detail-code {
            font-size: 12px; color: var(--primary); font-family: monospace;
            background: rgba(108, 99, 255, 0.1); padding: 2px 8px; border-radius: 4px;
            display: inline-block; margin-top: 4px; cursor: pointer;
        }
        .detail-code:hover { background: rgba(108, 99, 255, 0.25); }
        .detail-desc {
            font-size: 14px; color: var(--text-secondary); margin-top: 8px;
            line-height: 1.6; max-width: 420px; margin-left: auto; margin-right: auto;
        }
        .detail-level-xp {
            display: flex; gap: 12px; justify-content: center;
            margin-top: 10px; font-size: 12px; color: var(--text-muted);
        }
        .detail-level-xp span { display: flex; align-items: center; gap: 4px; }

        /* ── Detail Actions ── */
        .detail-actions {
            display: flex; gap: 8px; justify-content: center;
            padding: 14px 20px; border-bottom: 1px solid var(--card-border);
        }
        .detail-btn {
            padding: 8px 20px; border-radius: var(--radius-pill);
            font-size: 13px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: all 0.2s; border: none;
            flex: 1; text-align: center; min-width: 0;
        }
        .detail-btn.primary { background: var(--primary); color: #fff; }
        .detail-btn.primary:hover { background: var(--primary-hover); }
        .detail-btn.outline {
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--card-border);
        }
        .detail-btn.outline:hover { border-color: var(--primary); color: var(--text); }

        /* ── Detail Tags ── */
        .detail-tags {
            display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
            padding: 12px 20px;
        }
        .detail-tag {
            font-size: 11px; padding: 3px 10px; border-radius: var(--radius-pill);
            background: rgba(108, 99, 255, 0.12); color: var(--primary);
            font-weight: 500;
        }
        .detail-tag.cap {
            background: rgba(76, 175, 80, 0.12); color: var(--success);
        }

        /* ── Detail Capabilities ── */
        .detail-caps {
            padding: 0 20px 14px;
        }
        .detail-caps-title {
            font-size: 12px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
        }
        .detail-cap-list {
            display: flex; flex-direction: column; gap: 6px;
        }
        .detail-cap-item {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: var(--text-secondary);
            padding: 6px 10px; background: var(--input-bg); border-radius: 8px;
        }
        .detail-cap-item .icon { font-size: 16px; }

        /* ── Comments Section ── */
        .detail-comments {
            border-top: 1px solid var(--card-border);
            padding: 16px 20px;
        }
        .detail-comments-title {
            font-size: 13px; font-weight: 700; margin-bottom: 12px;
            display: flex; align-items: center; gap: 6px;
        }
        .comment-input-row {
            display: flex; gap: 8px; margin-bottom: 14px;
        }
        .comment-input {
            flex: 1; background: var(--input-bg); border: 1px solid var(--card-border);
            border-radius: var(--radius-pill); padding: 8px 14px;
            color: var(--text); font-size: 13px; font-family: inherit; outline: none;
        }
        .comment-input:focus { border-color: var(--primary); }
        .comment-input::placeholder { color: var(--text-muted); }
        .comment-send {
            background: var(--primary); border: none; color: #fff;
            padding: 8px 16px; border-radius: var(--radius-pill);
            font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .comment-send:hover { background: var(--primary-hover); }

        .comment-list { display: flex; flex-direction: column; gap: 10px; }
        .comment-item {
            display: flex; gap: 10px; font-size: 13px;
        }
        .comment-avatar {
            width: 32px; height: 32px; border-radius: 50%; background: var(--input-bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0;
        }
        .comment-body { flex: 1; min-width: 0; }
        .comment-author {
            font-weight: 600; font-size: 12px;
        }
        .comment-text {
            color: var(--text-secondary); margin-top: 2px; line-height: 1.5;
        }
        .comment-time {
            font-size: 11px; color: var(--text-muted); margin-top: 2px;
        }
        .comment-reply-btn {
            background: none; border: none; color: var(--text-muted); font-size: 11px;
            cursor: pointer; margin-left: 8px; font-family: inherit;
        }
        .comment-reply-btn:hover { color: var(--primary); }

        /* Nested replies */
        .comment-replies {
            margin-top: 8px; padding-left: 20px;
            border-left: 2px solid rgba(108, 99, 255, 0.4);
        }

        .bot-card.rented { opacity: 0.6; }
        .rental-status-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; margin-top: 8px; }

    <!-- ══════ Detail Modal ══════ -->
    <div class="modal-overlay" id="detailModal" onclick="if(event.target===this)closeDetail()">
        <div style="position:relative;max-width:560px;width:100%;max-height:75vh;">
            <div class="modal-content" id="detailContent" style="max-height:75vh;overflow-y:auto;border-radius:16px;">

    <script src="../shared/i18n.js"></script>

    <script src="shared/product-tour.js"></script>
    <script src="../shared/telemetry.js"></script>
    <script>
    /* ══════════════════════════════════════
       Real API Integration
       ══════════════════════════════════════ */
    const API_BASE = location.origin;
    let allBots = [];
    let currentDetailCode = null;
    let currentDetailMessages = [];

    /* ══════ State ══════ */
    let currentFilter = 'all';
    let currentSort = 'newest';
    let searchQuery = '';
    let selectedCaps = new Set();
    let rateMin = 1;
    let rateMax = 50;
    let _rateDebounce = null;

    /* ══════ API ══════ */
    async function apiFetch(path) {
        const r = await fetch(location.origin + path, { credentials: 'include' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
    }
    async function apiPost(path, body) {
        const r = await fetch(location.origin + path, { method:'POST', headers:{'Content-Type':'application/json'}, credentials: 'include', body:JSON.stringify(body) });
        return r.json();
    }

    /* ══════ Load ══════ */
    // Default: merge rental listings + community bots in one grid.
    // "出租" filter narrows to rental-only; other filters narrow to community-only.
    async function loadBots() {
        document.getElementById('loading').style.display = 'flex';
        try {
            const isRentalOnly = currentFilter === 'rental';
            const isCommunityFilter = currentFilter !== 'all' && currentFilter !== 'rental';

            // 1. Load community bots (skip when rental-only filter)
            let communityBots = [];
            if (!isRentalOnly) {
                const p = new URLSearchParams({ limit:'50', sort:currentSort });
                if (searchQuery) p.set('q', searchQuery);
                if (isCommunityFilter) p.set('tag', currentFilter);
                const data = await apiFetch('/api/community/search?' + p);
                communityBots = (data.results || []).map(r => ({
                    publicCode: r.publicCode, name: r.name || 'Unnamed', avatar: r.avatar || '🤖',
                    desc: r.description || '', tags: r.tags || [],
                    caps: (r.capabilities || []).map(c => c.name || c.id || c),
                    stars: r.avgRating || 0, reviews: r.messageCount || 0,
                    level: r.level || 1, xp: r.xp || 0,
                    isRental: false
                }));
            }

            // 2. Load rental listings (always, unless a community-specific filter is active)
            let rentalBots = [];
            if (!isCommunityFilter) {
                try {
                    const sortMap = { newest:'newest', popular:'rating', az:'rate_asc', za:'rate_desc' };
                    const sort = sortMap[currentSort] || 'rating';
                    const rp = new URLSearchParams({ sort, limit: '50' });
                    if (selectedCaps.size === 1) rp.set('capability', [...selectedCaps][0]);
                    if (rateMin > 1) rp.set('minRateMli', String(rateMin * 1000));
                    if (rateMax < 50) rp.set('maxRateMli', String(rateMax * 1000));
                    const data = await apiFetch('/api/rental/marketplace?' + rp);
                    rentalBots = (data.listings || []).map(l => {
                        const caps = l.capabilities ? Object.keys(l.capabilities).filter(k => l.capabilities[k]?.supported) : [];
                        return {
                            publicCode: l.owner_public_code || null, name: l.title || 'Rental Bot', avatar: l.avatar_url || '🤖',
                            desc: l.description || (l.model_detected || ''),
                            tags: caps, caps: caps, _capsObj: l.capabilities || {},
                            stars: l.avg_rating || 0, reviews: l.total_rentals || 0,
                            level: 0, xp: 0, isRental: true,
                            rateMli: l.rate_mli_per_ktoken,
                            minMin: l.min_rental_minutes, maxMin: l.max_rental_minutes,
                            uptimePct: l.uptime_pct || 100,
                            listingId: l.id,
                            modelDetected: l.model_detected,
                            hasActiveContract: !!l.has_active_contract,
                        };
                    });
                    // Client-side search filter for rental bots
                    if (searchQuery) {
                        const q = searchQuery.toLowerCase();
                        rentalBots = rentalBots.filter(b =>
                            b.name.toLowerCase().includes(q) ||
                            (b.modelDetected || '').toLowerCase().includes(q));
                    }
                    // Client-side multi-capability filter (API supports only 1)
                    if (selectedCaps.size > 1) {
                        rentalBots = rentalBots.filter(b =>
                            [...selectedCaps].every(c => b.caps.includes(c)));
                    }
                } catch { /* rental API unavailable — show community only */ }
            }

            // 3. Merge: rental listings first (highlighted), then community
            allBots = [...rentalBots, ...communityBots];
            renderGrid(allBots);
        } catch (e) {
            console.error('loadBots:', e);
            document.getElementById('emptyState').style.display = 'block';
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    /* ══════ Render ══════ */
    function renderGrid(bots) {
        const grid = document.getElementById('botGrid');
        const empty = document.getElementById('emptyState');
        document.getElementById('loadMore').style.display = 'none';
        if (!bots.length) { grid.innerHTML = ''; empty.style.display = 'block'; document.getElementById('resultCount').textContent = '0'; return; }
        empty.style.display = 'none';
        document.getElementById('resultCount').textContent = bots.length;
        grid.innerHTML = bots.map(bot => bot.isRental ? renderRentalCard(bot) : renderCommunityCard(bot)).join('');
    }
    function renderCommunityCard(bot) {
        return `<div class="bot-card" onclick="openDetail('${bot.publicCode}')">
            <span class="bot-card-level ${lvClass(bot.level)}">Lv.${bot.level}</span>
            <div class="bot-card-header">
                <div class="bot-card-avatar">
                    ${(bot.avatar||'').startsWith('http') ? `<img src="${esc(bot.avatar)}" alt="">` : (bot.avatar||'🤖')}
                </div>
                <div class="bot-card-info"><div class="bot-card-name">${esc(bot.name)}</div></div>
            </div>
            <div class="bot-card-desc">${esc(bot.desc)}</div>
            <div class="bot-card-footer">
                <div class="bot-card-tags">${bot.tags.slice(0,2).map(t=>`<span class="bot-card-tag">${esc(t)}</span>`).join('')}</div>
                <div class="bot-card-stats">
                    ${bot.stars > 0 ? `<span class="stat"><span class="stars">★</span> ${bot.stars.toFixed(1)}</span>` : ''}
                    <span class="stat">💬 ${bot.reviews}</span>
                </div>
            </div>
            <div class="bot-card-action">
                <button class="bot-card-quick-chat" onclick="event.stopPropagation();window.open('/c/${bot.publicCode}?utm_source=plaza&utm_medium=card','_blank')" title="開始對話">開始對話 →</button>
            </div>
        </div>`;
    }
    function capChipClass(cap) {
        return { python_exec:'python_exec', web_browse:'web_browse', vision:'vision', reasoning:'reasoning', coding:'coding' }[cap] || 'default-cap';
    }
    function renderRentalCard(bot) {
        const rate = (bot.rateMli / 1000).toFixed(1);
        const deposit = (bot.rateMli * 20 / 1000).toFixed(0);
        const stars = '\u2605'.repeat(Math.round(bot.stars)) + '\u2606'.repeat(5 - Math.round(bot.stars));
        const tt = (k, fb) => (typeof i18n !== 'undefined' ? i18n.t(k) : null) || fb;
        const isRented = !!bot.hasActiveContract;
        const borderColor = isRented ? '#F44336' : '#10b981';
        const statusBadge = isRented
            ? `<div class="rental-status-badge rented-badge">\ud83d\udd34 ${tt('mp_status_rented','\u5df2\u51fa\u79df')}</div>`
            : `<div class="rental-status-badge available">\ud83d\udfe2 ${tt('mp_status_available','\u53ef\u79df\u501f')}</div>`;
        return `<div class="${isRented ? 'bot-card rented' : 'bot-card'}" onclick="${isRented ? '' : "openRentalDetail('" + bot.listingId + "')"}" style="border-left:3px solid ${borderColor};">
            <span class="bot-card-level" style="background:${borderColor};color:#fff;">${isRented ? tt('mp_status_rented','\u5df2\u51fa\u79df') : tt('community_filter_rental','\u51fa\u79df')}</span>
            <div class="bot-card-header">
                <div class="bot-card-avatar">${bot.avatar && bot.avatar.startsWith('http') ? '<img src="' + esc(bot.avatar) + '" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">' : (bot.avatar || '\ud83e\udd16')}</div>
                <div class="bot-card-info">
                    <div class="bot-card-name">${esc(bot.name)}</div>
                    ${bot.modelDetected ? `<div style="font-size:11px;color:var(--text-secondary);">\ud83e\udd16 ${esc(bot.modelDetected)}</div>` : ''}
                </div>
            </div>
            <div class="bot-card-desc">${esc(bot.desc)}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
                <div style="font-size:14px;font-weight:700;color:#10b981;">${rate} e\u5e63/1K</div>
                <div style="font-size:11px;color:var(--text-secondary);">${tt('mp_d_deposit','\u62bc\u91d1')}: ${deposit} e\u5e63</div>
            </div>
            <div class="bot-card-footer" style="margin-top:6px;">
                <div class="bot-card-tags">${bot.caps.slice(0,3).map(c => {
                    const sup = bot._capsObj && bot._capsObj[c]?.supported;
                    return `<span class="bot-card-tag cap-chip ${capChipClass(c)}">${esc(c)}${sup ? ' \u2713' : ' \u2717'}</span>`;
                }).join('')}</div>
                <div class="bot-card-stats">

    function renderComments(msgs) {
        if (!msgs.length) return '<div style="color:var(--text-muted);text-align:center;padding:12px;">還沒有留言，成為第一個！</div>';
        return msgs.map(m => {
            const t = m.created_at ? new Date(m.created_at).toLocaleString() : '';
            return `<div class="comment-item"><div class="comment-avatar">${m.author_type==='bot'?'🤖':'👤'}</div><div class="comment-body"><div class="comment-author">${esc(m.author_name||'Anonymous')}</div><div class="comment-text">${esc(m.text)}</div><div class="comment-time">${t}</div></div></div>`;
        }).join('');
    }

    async function sendComment() {
        const input = document.getElementById('commentInput');
        const text = (input?.value||'').trim();
        if (!text || !currentDetailCode) return;
        const deviceId = localStorage.getItem('eclaw_device_id');
        const deviceSecret = localStorage.getItem('eclaw_device_secret');
        if (!deviceId || !deviceSecret) { showToast(ttt('mp_login_first', '請先登入才能留言'), 'error'); return; }
        input.disabled = true;
        try {
            const data = await apiPost('/api/community/card/' + currentDetailCode + '/message', { deviceId, deviceSecret, text });
            if (data.success && data.message) {
                currentDetailMessages.unshift(data.message);
                document.getElementById('commentList').innerHTML = renderComments(currentDetailMessages);
                input.value = '';
            } else { showToast(data.error || '留言失敗', 'error'); }
        } catch (e) { showToast('留言失敗', 'error'); }
        finally { input.disabled = false; input.focus(); }
    }

    let _rentalWalletBalance = null;
    function updateRentalEstimate(rateMli, depositEcoin) {
        const hoursEl = document.getElementById('rentalDurationHours');
        const costBox = document.getElementById('rentalCostBox');
        const balBox = document.getElementById('rentalBalanceBox');
        const rentBtn = document.getElementById('rentalConfirmBtn');
        const privacyCb = document.getElementById('privacyConsent');
        if (!hoursEl || !costBox) return;
        const hours = parseFloat(hoursEl.value) || 0;
        const rateEcoin = rateMli / 1000;
        const usageEcoin = hours * 60000 * rateEcoin / 1000;
        const totalEcoin = depositEcoin + usageEcoin;
        const t = (k, fb) => (typeof i18n !== 'undefined' ? i18n.t(k) : null) || fb;
        costBox.innerHTML = `<div class="cost-line"><span>${t('mp_est_deposit','Deposit')}</span><span>${depositEcoin} e\u5e63</span></div><div class="cost-line"><span>${t('mp_est_usage','Est. usage')}</span><span>~${usageEcoin.toFixed(1)} e\u5e63</span></div><div class="cost-line cost-total"><span>${t('mp_est_total','Est. total')}</span><span>~${totalEcoin.toFixed(1)} e\u5e63</span></div>`;
        if (_rentalWalletBalance !== null && balBox) {
            const balEcoin = _rentalWalletBalance / 1000;
            const required = depositEcoin + rateEcoin * 60;
            if (balEcoin >= required) {
                balBox.innerHTML = `<div class="balance-indicator sufficient">\u2705 ${t('mp_bal_your','Balance')}: ${balEcoin.toFixed(0)} e\u5e63 \u2014 ${t('mp_bal_sufficient','Sufficient')}</div>`;
                if (rentBtn) rentBtn.disabled = !(privacyCb && privacyCb.checked);
            } else {
                const deficit = (required - balEcoin).toFixed(0);
                balBox.innerHTML = `<div class="balance-indicator insufficient">\u274c ${t('mp_bal_insufficient','Insufficient')} \u2014 ${t('mp_bal_need','Need')} ${required.toFixed(0)}, ${t('mp_bal_current','Current')} ${balEcoin.toFixed(0)} (${t('mp_bal_deficit','Deficit')} ${deficit}) <a class="topup-link" href="wallet.html#topup">${t('mp_bal_topup','Top Up')}</a></div>`;
                if (rentBtn) rentBtn.disabled = true;
            }
        }
    }

        btn.disabled = !cb.checked || !!(balBox && balBox.querySelector('.insufficient'));
    }

    function translateRentalError(code) {
        const i18nKey = {
            'cooldown_active': 'rental_error_cooldown',
            'self_rental_forbidden': 'rental_error_self_rent',
            'listing_already_rented': 'rental_error_already_rented',
            'insufficient_balance_for_rental': 'rental_error_insufficient',
            'listing_not_available': 'rental_error_not_available',
        }[code];
        if (!i18nKey) return null;
        const translated = typeof i18n !== 'undefined' ? i18n.t(i18nKey) : null;
        // i18n.t may return the key itself if not found — fall back to English
        if (translated && translated !== i18nKey) return translated;
        const fallbacks = {
            'rental_error_cooldown': 'This bot has a 24-hour cooldown period. Please try again later.',
            'rental_error_self_rent': 'You cannot rent your own bot.',
            'rental_error_already_rented': 'This bot is already rented by someone else.',
            'rental_error_insufficient': 'Insufficient e-coin balance for this rental.',
            'rental_error_not_available': 'This listing is no longer available.',
        };
        return fallbacks[i18nKey];
    }

    async function doRentalFromPlaza(listingId, rateMli) {
        const ttt = (k, fb) => (typeof i18n !== 'undefined' ? i18n.t(k) : null) || fb;
        const btn = document.getElementById('rentalConfirmBtn');
        const btnLabel = '\ud83d\udd12 ' + ttt('mp_rent_now','Rent Now');
        if (btn) { btn.disabled = true; btn.textContent = ttt('mp_renting','Processing...'); }
        try {
            const user = await apiFetch('/api/auth/me');
            if (!user?.user) { showToast(ttt('mp_login_first','Please login'), 'error'); if (btn) { btn.disabled = false; btn.textContent = btnLabel; } return; }
            const hours = parseFloat(document.getElementById('rentalDurationHours')?.value) || 1;
            const data = await apiPost('/api/rental/contract', {
                listingId,
                renterDeviceId: user.user.deviceId || user.user.device_id || 'web',
                durationMinutes: Math.round(hours * 60),
            });
            if (data?.success) {
                const content = document.getElementById('detailContent');
                if (content) {
                    content.innerHTML = `<div class="rental-success-overlay">
                        <div class="success-icon">\u2705</div>
                        <div class="success-text">${ttt('mp_rent_success_title','Rental successful!')}</div>
                        <p style="color:var(--text-secondary);font-size:13px;margin-top:8px;">${ttt('mp_rent_success_desc','Bot has been added to your device.')}</p>
                        <div class="success-actions">
                            <button class="detail-btn primary" onclick="window.location.href='chat.html'">\ud83d\udde3\ufe0f ${ttt('mp_start_chat','Start Chat')}</button>
                            <button class="detail-btn outline" onclick="window.location.href='my-rentals.html'">\ud83d\udccb ${ttt('mp_view_contract','View Contract')}</button>
                        </div></div>`;
                }
                setTimeout(() => { closeDetail(); loadBots(); }, 3000);
            } else {
                const errCode = data?.error || '';
                showToast(translateRentalError(errCode) || errCode || 'Failed', 'error');
                if (btn) { btn.disabled = false; btn.textContent = btnLabel; }
            }
        } catch (err) {
            const errCode = err.message || '';
            showToast(translateRentalError(errCode) || errCode || 'Rental failed', 'error');
            if (btn) { btn.disabled = false; btn.textContent = btnLabel; }
        }
    }

    function quoteToChat(source, title, excerpt) {
        if (window.self !== window.top) {
            window.parent.postMessage({ type: 'eclaw_quote', source, title, excerpt: excerpt || '' }, window.location.origin);
        } else {
            localStorage.setItem('eclaw_pending_quote', JSON.stringify({ source, title, excerpt: excerpt || '', ts: Date.now() }));
            window.location.href = '/portal/chat.html';
        }
    }

                target: () => document.getElementById('rentalConfirmBtn'),
                i18nKey: 'onboarding_tour_track1_step3',
                fallback: 'Press here to start renting.',
                timeout: 15000,
                // If user clicks Next without completing the rental, skip to settings anyway —
                // the rental success hook below handles the happy path.
                onNext: () => { window.location.href = SETTINGS_URL; }
            }
        ], { totalSteps: 5 });

        const resumeAt = Math.max(0, Math.min(_tourStep, 2));
        setTimeout(() => ProductTour.goTo('track1', resumeAt), 400);

        const _openRentalDetailOriginal = window.openRentalDetail;
        if (typeof _openRentalDetailOriginal === 'function') {
            window.openRentalDetail = async function () {
                const result = await _openRentalDetailOriginal.apply(this, arguments);
                const state = ProductTour.getState && ProductTour.getState();
                if (state && state.id === 'track1' && state.stepIdx === 1) {
                    setTimeout(() => ProductTour.goTo('track1', 2), 300);
                }
                return result;
            };
        }

        const _doRentalOriginal = window.doRentalFromPlaza;
        if (typeof _doRentalOriginal === 'function') {
            window.doRentalFromPlaza = async function () {
                await _doRentalOriginal.apply(this, arguments);
                if (!document.getElementById('rentalConfirmBtn')) {
                    setTimeout(() => { window.location.href = SETTINGS_URL; }, 1800);
                }
            };
        }
    })();

    /* ══════ Onboarding Tour (Track 2: Paid e-coin Bot Rental) — steps 1-3 ══════ */
    (function initTourTrack2() {
        if (_tourParam !== 'track2') return;
        if (typeof ProductTour === 'undefined') return;
        if (ProductTour.isDone('track2')) return;

        const WALLET_URL = '/portal/wallet.html?tour=track2&step=4#topup';

        ProductTour.register('track2', [
            {
                target: '.plaza-chip[data-filter="rental"]',
                i18nKey: 'onboarding_tour_track2_step1',
                fallback: 'Paid and free bots both live here. Track 2 focuses on the paid side.'
            },
            {
                target: () => document.querySelector('#botGrid .bot-card'),
                i18nKey: 'onboarding_tour_track2_step2',
                fallback: 'Each card shows the e-coin rate per 1K tokens — that is what you pay as the bot works.',
                timeout: 12000
            },
            {
                target: () => document.querySelector('#botGrid .bot-card'),
                i18nKey: 'onboarding_tour_track2_step3',
                fallback: 'Tap a card to open full terms. We will hop to the wallet next — no charge yet.',
                timeout: 12000,
                onNext: () => { window.location.href = WALLET_URL; }
            }
        ], { totalSteps: 5 });

        const resumeAt = Math.max(0, Math.min(_tourStep, 2));
        setTimeout(() => ProductTour.goTo('track2', resumeAt), 400);
    })();
    </script>
</body>

</html>
