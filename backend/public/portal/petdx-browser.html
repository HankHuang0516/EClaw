<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petdx 伙伴瀏覽器 / Companion Browser</title>
<meta name="description" content="EClaw Petdx companion browser — preview, filter, and pick procedural companions for your wallpaper.">
<style>
    :root {
        --bg: #0d0d10;
        --panel: #16161c;
        --panel-2: #1c1c24;
        --text: #e8e8e8;
        --muted: #8c8c95;
        --border: #2a2a32;
        --accent: #e63946;
        --accent-soft: rgba(230, 57, 70, 0.12);
        --ok: #4caf50;
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0; padding: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
        min-height: 100vh;
    }
    .topbar {
        position: sticky; top: 0; z-index: 5;
        background: rgba(13, 13, 16, 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
    }
    .topbar-row {
        max-width: 1280px; margin: 0 auto;
        display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    }
    .topbar h1 { font-size: 18px; margin: 0; flex: 0 0 auto; }
    .topbar .sub { color: var(--muted); font-size: 12px; margin-left: 4px; }
    .search {
        flex: 1 1 200px; min-width: 200px;
        background: var(--panel); border: 1px solid var(--border);
        color: var(--text); padding: 8px 12px; border-radius: 6px;
        font: inherit;
    }
    .search:focus { outline: none; border-color: var(--accent); }
    .entity-selector {
        flex: 0 0 auto;
        background: var(--panel); border: 1px solid var(--border);
        color: var(--text); padding: 8px 10px; border-radius: 6px;
        font: inherit; cursor: pointer; min-width: 180px;
    }
    .entity-selector:focus { outline: none; border-color: var(--accent); }
    .entity-selector:disabled { opacity: 0.6; cursor: not-allowed; }
    .filters {
        max-width: 1280px; margin: 0 auto;
        display: flex; flex-wrap: wrap; gap: 6px; padding-top: 8px;
    }
    .chip {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 28px;
        background: var(--panel); border: 1px solid var(--border);
        color: var(--text); padding: 4px 10px; border-radius: 999px;
        font-size: 12px; cursor: pointer;
        transition: background 0.12s, border-color 0.12s;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .chip-group { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
    .chip-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 0 4px; }
    .login-warn a { display: inline-flex; align-items: center; min-height: 28px; }
    main {
        max-width: 1280px; margin: 0 auto; padding: 16px;
    }
    .status-bar {
        display: flex; justify-content: space-between; color: var(--muted);
        font-size: 12px; margin-bottom: 12px;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
    }
    .card {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 10px; padding: 10px; cursor: pointer;
        transition: transform 0.12s, border-color 0.12s;
        display: flex; flex-direction: column; gap: 8px;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card canvas {
        width: 100%; aspect-ratio: 1 / 1;
        background: #000; border-radius: 8px;
        display: block;
    }
    .card .name { font-size: 13px; font-weight: 600; }
    .card .meta {
        display: flex; flex-wrap: wrap; gap: 4px;
        color: var(--muted); font-size: 11px;
    }
    .card .scope {
        font-size: 10px; padding: 1px 6px; border-radius: 999px;
        background: var(--panel-2); border: 1px solid var(--border);
        text-transform: uppercase; letter-spacing: 0.05em;
    }
    .card .scope.system    { color: #ffb04a; border-color: #5a3000; }
    .card .scope.community { color: #4ac2ff; border-color: #003a5a; }
    .card .scope.mine      { color: var(--ok); border-color: #054b0c; }
    .empty {
        text-align: center; color: var(--muted);
        padding: 80px 16px;
    }
    .empty button {
        margin-top: 12px;
        background: var(--accent); border: none; color: #fff;
        padding: 8px 16px; border-radius: 6px; cursor: pointer;
        font: inherit;
    }
    .pager {
        display: inline-flex; align-items: center; gap: 8px;
    }
    .pager-btn {
        background: var(--panel); border: 1px solid var(--border); color: var(--text);
        padding: 4px 10px; border-radius: 6px; cursor: pointer;
        font: inherit; font-size: 12px;
    }
    .pager-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .pager-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .pager-info { color: var(--muted); font-size: 12px; }
    .pager-controls {
        max-width: 1280px; margin: 16px auto 0;
        display: flex; justify-content: center;
    }
    .login-warn {
        padding: 12px; margin-bottom: 12px;
        background: #5a3000; color: #ffb04a;
        border-radius: 8px; font-size: 13px;
    }
    .login-warn a { color: #ffd99a; }

    /* Detail modal */
    .modal-bg {
        position: fixed; inset: 0; z-index: 10;
        background: rgba(0, 0, 0, 0.7);
        display: none; align-items: center; justify-content: center;
        padding: 16px;
    }
    .modal-bg.open { display: flex; }
    .modal {
        background: var(--panel); border-radius: 12px;
        max-width: 640px; width: 100%; max-height: 90vh; overflow-y: auto;
        padding: 20px;
    }
    .modal-canvas {
        width: 100%; max-width: 320px; aspect-ratio: 1 / 1;
        background: #000; border-radius: 8px; margin: 12px auto; display: block;
    }
    .modal h2 { margin: 0 0 4px; font-size: 18px; }
    .modal .modal-meta { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    .modal .state-buttons {
        display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0;
        justify-content: center;
    }
    .modal button {
        background: var(--panel-2); border: 1px solid var(--border);
        color: var(--text); padding: 6px 12px; border-radius: 6px;
        font: inherit; cursor: pointer;
    }
    .modal button:hover { border-color: var(--accent); }
    .modal button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .modal-actions {
        display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px;
        border-top: 1px solid var(--border); padding-top: 12px;
    }
    .modal pre {
        background: var(--panel-2); border-radius: 8px;
        padding: 10px; font-size: 11px; overflow: auto;
        max-height: 200px; margin: 0;
    }
    .modal .close {
        position: absolute; top: 12px; right: 16px;
        background: none; border: none; color: var(--muted);
        font-size: 22px; cursor: pointer;
    }
    .modal-host { position: relative; }

    @media (max-width: 600px) {
        .topbar h1 { font-size: 16px; }
        .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-row">
        <h1>Petdx 伙伴瀏覽器</h1>
        <span class="sub">Companion Browser · v0.2</span>
        <select id="entity-selector" class="entity-selector" title="切換要更換伙伴的對象 / Switch which entity's companion you're changing">
            <option value="">🖥️ 全裝置 / Device-wide</option>
        </select>
        <input id="search" class="search" type="search" placeholder="搜尋伙伴名稱或描述 / Search…" autocomplete="off">
    </div>
    <div class="filters" id="filters"></div>
</div>

<main>
    <div id="login-warn" class="login-warn" style="display: none;">
        ⚠️ 尚未登入或找不到 device 憑證。請先 <a href="/portal/index.html">登入主控台</a>，或在開發模式下用 <code>?deviceId=...&deviceSecret=...</code> 帶入。
    </div>
    <div class="status-bar">
        <span id="status">載入中…</span>
        <span id="pagination"></span>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display: none;">
        <div id="empty-msg">沒有符合條件的伙伴 / No companions match your filter.</div>
        <button id="empty-reset" onclick="resetFilters()">清除篩選 / Reset</button>
    </div>
    <div class="pager-controls" id="pager-controls"></div>
</main>

<div id="modal" class="modal-bg" role="dialog" aria-modal="true">
    <div class="modal modal-host">
        <button class="close" id="modal-close" aria-label="Close">×</button>
        <div id="modal-body"></div>
    </div>
</div>

<script src="/shared/i18n.js"></script>
<script src="/shared/petdx-renderer.js"></script>
<script>
(function () {
    'use strict';

    function t(key, params) {
        if (typeof i18n !== 'undefined' && typeof i18n.t === 'function') {
            return i18n.t(key, params || {});
        }
        const fallback = {
            petdx_switch_success: 'Switched to {name}',
            petdx_switch_failed: 'Switch failed: {error}',
            petdx_network_error: 'Network error: {error}',
            petdx_favorite_failed: 'Save to favorites failed: {error}',
        };
        let s = fallback[key] || key;
        Object.keys(params || {}).forEach(k => {
            s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]);
        });
        return s;
    }

    // ── Auth ──────────────────────────────────────────────────────
    // activeEntityId is the user's in-UI pick:
    //   '' → device-wide (no entityId on requests)
    //   '<n>' → write/read companion selection for entity N
    // It's seeded from URL (?entityId=N) or localStorage, persisted across
    // reloads, and overridden by the selector dropdown.
    const ACTIVE_ENTITY_KEY = 'eclaw_petdex_active_entity_id';
    let activeEntityId = '';

    function getCreds() {
        const url = new URLSearchParams(location.search);
        const deviceId = url.get('deviceId') || localStorage.getItem('eclaw_device_id') || '';
        const deviceSecret = url.get('deviceSecret') || localStorage.getItem('eclaw_device_secret') || '';
        const entityId = url.get('entityId') || '';
        const botSecret = url.get('botSecret') || '';
        return { deviceId, deviceSecret, entityId, botSecret };
    }

    function authQuery() {
        const c = getCreds();
        const p = new URLSearchParams();
        if (c.deviceId) p.set('deviceId', c.deviceId);
        if (c.deviceSecret) p.set('deviceSecret', c.deviceSecret);
        if (c.botSecret) p.set('botSecret', c.botSecret);
        // Bot-auth callers must use their bound entityId; device-auth callers
        // can switch freely via the selector. When both creds are present we
        // prefer the selector pick (lets owners with a stray ?botSecret= URL
        // still switch entities).
        if (c.deviceSecret) {
            if (activeEntityId) p.set('entityId', activeEntityId);
        } else if (c.entityId) {
            p.set('entityId', c.entityId);
        }
        return p;
    }

    // ── Filter state ──────────────────────────────────────────────
    const FILTER_GROUPS = [
        { key: 'scope',     label: '範圍', options: [
            { v: '',          t: '全部' },
            { v: 'system',    t: '官方' },
            { v: 'community', t: '社群' },
            { v: 'mine',      t: '我的' },
        ] },
        { key: 'category',  label: '類型', options: [
            { v: '',        t: '全部' },
            { v: 'mascot',  t: '吉祥物' },
            { v: 'animal',  t: '動物' },
            { v: 'human',   t: '人物' },
            { v: 'robot',   t: '機器人' },
            { v: 'custom',  t: '自訂' },
        ] },
        { key: 'sort', label: '排序', options: [
            { v: 'popular',   t: '熱門' },
            { v: 'recent',    t: '最新' },
            { v: 'rating',    t: '評分' },
            { v: 'favorites', t: '收藏' },
        ] },
    ];
    const filterState = { scope: '', category: '', sort: 'popular' };
    let searchTerm = '';
    // Pagination state (Hank 2026-06-14): 60-per-page prev/next, no accumulation.
    // Each page-flip *replaces* grid content so DOM nodes from the previous page
    // are released to GC — prevents memory bloat on long browsing sessions.
    const PAGE_SIZE = 60;
    let currentPage = 1;
    let totalCount = 0;
    let totalPages = 1;
    let isLoading = false;
    let searchTimer = 0;

    // Sync ?page=N back into the URL bar without reloading. Preserves all other
    // query params (deviceId/deviceSecret/entityId/botSecret/…) so a deep link
    // copied off the address bar keeps the user logged in on the right page.
    function syncUrlPage() {
        try {
            const params = new URLSearchParams(location.search);
            if (currentPage > 1) params.set('page', String(currentPage));
            else params.delete('page');
            const qs = params.toString();
            const newUrl = location.pathname + (qs ? '?' + qs : '') + location.hash;
            history.replaceState(null, '', newUrl);
        } catch (_) { /* history API failure is non-fatal */ }
    }

    // ── Renderer pool ─────────────────────────────────────────────
    // One PetdxRenderer controller per visible card. We tear down on
    // re-render to keep rAF count bounded.
    const activeRenderers = [];
    function tearDownRenderers() {
        while (activeRenderers.length) {
            try { activeRenderers.pop().stop(); } catch (e) { /* swallow */ }
        }
    }

    // ── Filter UI ─────────────────────────────────────────────────
    function renderFilters() {
        const root = document.getElementById('filters');
        root.innerHTML = '';
        FILTER_GROUPS.forEach(group => {
            const g = document.createElement('div');
            g.className = 'chip-group';
            const lbl = document.createElement('span');
            lbl.className = 'chip-label';
            lbl.textContent = group.label;
            g.appendChild(lbl);
            group.options.forEach(opt => {
                const c = document.createElement('button');
                c.className = 'chip';
                if (filterState[group.key] === opt.v) c.classList.add('active');
                c.textContent = opt.t;
                c.addEventListener('click', () => {
                    filterState[group.key] = opt.v;
                    currentPage = 1;
                    renderFilters();
                    loadList();
                });
                g.appendChild(c);
            });
            root.appendChild(g);
        });
    }

    window.resetFilters = function () {
        Object.keys(filterState).forEach(k => filterState[k] = (k === 'sort' ? 'popular' : ''));
        searchTerm = '';
        currentPage = 1;
        document.getElementById('search').value = '';
        renderFilters();
        loadList();
    };

    // ── List loader ───────────────────────────────────────────────
    // loadList(): always loads the page in `currentPage`, replacing grid
    // content (no append). Filter/search/entity changes reset currentPage=1
    // *before* calling this; prev/next set currentPage explicitly.
    async function loadList() {
        const status = document.getElementById('status');
        const grid = document.getElementById('grid');
        const empty = document.getElementById('empty');
        const emptyMsg = document.getElementById('empty-msg');
        const emptyReset = document.getElementById('empty-reset');

        const creds = getCreds();
        if (!creds.deviceId || (!creds.deviceSecret && !creds.botSecret)) {
            document.getElementById('login-warn').style.display = 'block';
            status.textContent = '未登入';
            return;
        }

        if (isLoading) return;
        isLoading = true;

        // Tear down current page renderers + clear grid BEFORE the fetch so
        // the old DOM nodes can be GC'd while we wait. Critical for memory.
        empty.style.display = 'none';
        tearDownRenderers();
        grid.innerHTML = '';
        status.textContent = '載入中…';

        const q = authQuery();
        if (filterState.scope)    q.set('scope', filterState.scope);
        if (filterState.category) q.set('category', filterState.category);
        if (filterState.sort)     q.set('sort', filterState.sort);
        if (searchTerm)           q.set('q', searchTerm);
        q.set('limit', String(PAGE_SIZE));
        q.set('page', String(currentPage));

        let data;
        try {
            const r = await fetch('/api/companion/list?' + q.toString());
            data = await r.json();
            if (!data.success) {
                status.textContent = '載入失敗：' + (data.error || r.status);
                return;
            }
        } catch (err) {
            status.textContent = '網路錯誤：' + err.message;
            return;
        } finally {
            isLoading = false;
        }

        const items = data.companions || [];
        totalCount = data.total || 0;
        totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));

        // Clamp currentPage if the active filter shrank the result set so much
        // that the saved page no longer exists (e.g. user on page 5, then
        // applies a filter that has only 2 pages).
        if (currentPage > totalPages) {
            currentPage = totalPages;
            isLoading = false;
            syncUrlPage();
            return loadList();
        }

        status.textContent = '共 ' + totalCount + ' 個伙伴';

        if (totalCount === 0) {
            // Distinguish "no companions exist at all" from "no match for current
            // filter" — first is a system-wide empty state, second is filter UX.
            const filtered = !!(searchTerm || filterState.scope || filterState.category);
            if (filtered) {
                emptyMsg.textContent = '沒有符合條件的伙伴 / No companions match your filter.';
                emptyReset.style.display = '';
            } else {
                emptyMsg.textContent = '尚無夥伴 / No partners yet.';
                emptyReset.style.display = 'none';
            }
            empty.style.display = 'block';
            renderPagination();
            syncUrlPage();
            return;
        }

        items.forEach(card => {
            const node = renderCardNode(card);
            grid.appendChild(node);
        });
        renderPagination();
        syncUrlPage();
    }

    function goToPage(n) {
        const clamped = Math.max(1, Math.min(totalPages, n));
        if (clamped === currentPage) return;
        currentPage = clamped;
        loadList();
        // Scroll back to the top of the grid so the user sees the new page,
        // not whatever scroll position the previous page left them at.
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Render the prev/next pager beneath the grid + a compact "Page X of Y"
    // indicator in the top status bar. Both slots stay in sync.
    function renderPagination() {
        const topSlot = document.getElementById('pagination');
        const pagerSlot = document.getElementById('pager-controls');
        if (!topSlot || !pagerSlot) return;

        topSlot.textContent = totalCount > 0
            ? `第 ${currentPage} / ${totalPages} 頁 · Page ${currentPage} of ${totalPages}`
            : '';

        pagerSlot.innerHTML = '';
        if (totalPages <= 1) return;

        const pager = document.createElement('div');
        pager.className = 'pager';

        const prev = document.createElement('button');
        prev.type = 'button';
        prev.className = 'pager-btn';
        prev.textContent = '‹ 上一頁 / Prev';
        prev.disabled = currentPage <= 1;
        prev.addEventListener('click', () => goToPage(currentPage - 1));
        pager.appendChild(prev);

        const info = document.createElement('span');
        info.className = 'pager-info';
        info.textContent = `${currentPage} / ${totalPages}`;
        pager.appendChild(info);

        const next = document.createElement('button');
        next.type = 'button';
        next.className = 'pager-btn';
        next.textContent = '下一頁 / Next ›';
        next.disabled = currentPage >= totalPages;
        next.addEventListener('click', () => goToPage(currentPage + 1));
        pager.appendChild(next);

        pagerSlot.appendChild(pager);
    }

    // ── Card node ─────────────────────────────────────────────────
    function renderCardNode(card) {
        const div = document.createElement('div');
        div.className = 'card';
        div.tabIndex = 0;
        div.setAttribute('role', 'button');
        div.dataset.companionId = card.id;

        const canvas = document.createElement('canvas');
        canvas.width = 200; canvas.height = 200;
        div.appendChild(canvas);

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = card.name;
        div.appendChild(name);

        const meta = document.createElement('div');
        meta.className = 'meta';
        if (card.scope) {
            const s = document.createElement('span');
            s.className = 'scope ' + card.scope;
            s.textContent = card.scope;
            meta.appendChild(s);
        }
        if (card.category) {
            const c = document.createElement('span');
            c.textContent = '· ' + card.category;
            meta.appendChild(c);
        }
        div.appendChild(meta);

        // Animate: build a synthetic descriptor from the card payload
        // so we can preview without a second API call. The full
        // descriptor with params lives behind GET /:id which the modal
        // uses for the bigger preview.
        const assetType = card.assetType || 'procedural';
        let descriptor;
        if (assetType === 'spritesheet' && card.asset && card.asset.url) {
            // Spritesheet cards (Petdex bridge) carry asset metadata + state→
            // animation map on the list payload — pass them through.
            descriptor = {
                id: card.id,
                name: card.name,
                assetType: 'spritesheet',
                asset: card.asset,
                supportedStates: card.supportedStates && card.supportedStates.length
                    ? card.supportedStates
                    : ['IDLE'],
                stateAssets: card.stateAssets || { IDLE: { animation: 'idle', loop: true } },
            };
        } else {
            const rendererKey = rendererKeyFromCard(card);
            descriptor = {
                id: card.id,
                name: card.name,
                assetType,
                asset: {
                    renderer: rendererKey,
                    params: { bodyColor: card.color, color: card.color },
                },
                supportedStates: card.supportedStates && card.supportedStates.length
                    ? card.supportedStates
                    : ['IDLE'],
                stateAssets: { IDLE: { fps: 4, loop: true } },
            };
        }

        try {
            const r = PetdxRenderer.createRenderer({
                canvas, descriptor, state: 'IDLE',
                onError: () => {}, // keep grid alive on bad frame
            });
            r.start();
            activeRenderers.push(r);
        } catch (e) {
            // descriptor invalid — leave canvas blank
        }

        const open = () => openDetail(card);
        div.addEventListener('click', open);
        div.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
        });
        return div;
    }

    function rendererKeyFromCard(card) {
        // descriptor.asset.renderer isn't surfaced on the list payload, so
        // we keyword-guess from id/name/tags. Detail dialogs use the real
        // descriptor.asset.renderer from /api/companion/:id and bypass this.
        // Unknown → fallback-blob (registered in petdx-renderer.js).
        if (card.renderer) return card.renderer;
        const id = (card.id || '').toLowerCase();
        const name = (card.name || '').toLowerCase();
        const tags = (card.tags || []).map(t => String(t).toLowerCase());
        const haystack = id + ' ' + name + ' ' + tags.join(' ');
        if (haystack.includes('lobster') || haystack.includes('龍蝦')) return 'lobster-procedural';
        if (haystack.includes('dog') || haystack.includes('獵犬') || haystack.includes('狗')) return 'dog-procedural';
        if (haystack.includes('cat') || haystack.includes('貓')) return 'cat-procedural';
        return 'fallback-blob';
    }

    // ── Detail modal ──────────────────────────────────────────────
    let modalRenderer = null;
    let modalDescriptor = null;

    async function openDetail(card) {
        const modal = document.getElementById('modal');
        const body = document.getElementById('modal-body');
        body.innerHTML = '<div style="padding: 40px; text-align: center; color: var(--muted);">載入中…</div>';
        modal.classList.add('open');

        const q = authQuery();
        let detail = null;
        // Re-pull /current alongside the descriptor so the favorite/select
        // buttons reflect cross-device state (e.g. user starred on web,
        // opened in-app a moment later). Boot-time refreshOwnerState()
        // alone goes stale within seconds.
        const [detailRes] = await Promise.all([
            fetch('/api/companion/' + encodeURIComponent(card.id) + '?' + q.toString())
                .then(r => r.json()).catch(() => null),
            refreshOwnerState(),
        ]);
        if (detailRes && detailRes.success) detail = detailRes.companion;

        if (!detail) {
            body.innerHTML = '<h2>' + escapeHtml(card.name) + '</h2><p>無法載入詳細資訊。</p>';
            return;
        }
        renderModalBody(detail);
    }

    function renderModalBody(detail) {
        const body = document.getElementById('modal-body');
        body.innerHTML = '';

        const h = document.createElement('h2');
        h.textContent = detail.name;
        body.appendChild(h);

        const meta = document.createElement('div');
        meta.className = 'modal-meta';
        meta.textContent = [
            detail.scope,
            detail.category || '',
            detail.assetType || '',
            'v' + (detail.version || '1.0.0'),
        ].filter(Boolean).join(' · ');
        body.appendChild(meta);

        const canvas = document.createElement('canvas');
        canvas.className = 'modal-canvas';
        canvas.width = 320; canvas.height = 320;
        body.appendChild(canvas);

        const stateBtns = document.createElement('div');
        stateBtns.className = 'state-buttons';
        body.appendChild(stateBtns);

        modalDescriptor = detail.descriptor && detail.descriptor.assetType
            ? detail.descriptor
            : {
                id: detail.id, name: detail.name,
                assetType: detail.assetType || 'procedural',
                asset: { renderer: rendererKeyFromCard(detail), params: { color: detail.color } },
                supportedStates: detail.supportedStates || ['IDLE'],
                stateAssets: { IDLE: { fps: 4, loop: true } },
            };

        try {
            if (modalRenderer) modalRenderer.stop();
            modalRenderer = PetdxRenderer.createRenderer({
                canvas, descriptor: modalDescriptor, state: 'IDLE',
                onError: () => {},
            });
            modalRenderer.start();
        } catch (e) {
            canvas.style.display = 'none';
        }

        (modalDescriptor.supportedStates || ['IDLE']).forEach(state => {
            const b = document.createElement('button');
            b.textContent = state;
            if (state === 'IDLE') b.classList.add('primary');
            b.addEventListener('click', () => {
                if (!modalRenderer) return;
                modalRenderer.setState(state);
                Array.from(stateBtns.children).forEach(c => c.classList.remove('primary'));
                b.classList.add('primary');
            });
            stateBtns.appendChild(b);
        });

        const actions = document.createElement('div');
        actions.className = 'modal-actions';
        const selectBtn = document.createElement('button');
        selectBtn.className = 'primary';
        selectBtn.textContent = currentSelectionId === detail.id
            ? '✓ 目前選用' : '一鍵切換 / Select';
        selectBtn.addEventListener('click', () => onSelect(detail));
        const favBtn = document.createElement('button');
        favBtn.textContent = favoriteIds.has(detail.id) ? '★ 已收藏' : '☆ 收藏';
        favBtn.addEventListener('click', () => onFavorite(detail, favBtn));
        actions.appendChild(selectBtn);
        actions.appendChild(favBtn);
        body.appendChild(actions);

        if (detail.descriptor) {
            const pre = document.createElement('pre');
            pre.textContent = JSON.stringify(detail.descriptor, null, 2);
            body.appendChild(pre);
        }
    }

    // Local cache populated from /current on load + every favorite toggle.
    // Used to label the modal favorite button correctly (add vs remove).
    const favoriteIds = new Set();
    let currentSelectionId = null;

    async function refreshOwnerState() {
        const creds = getCreds();
        if (!creds.deviceId || (!creds.deviceSecret && !creds.botSecret)) return;
        const q = authQuery();
        try {
            const r = await fetch('/api/companion/current?' + q.toString());
            if (!r.ok) return;
            const data = await r.json();
            favoriteIds.clear();
            (data.favorites || []).forEach(f => favoriteIds.add(f.companionId));
            currentSelectionId = data.selection?.companion?.id || null;
        } catch (_) {
            // Non-fatal: portal still works without state echo.
        }
    }

    async function onSelect(detail) {
        const q = authQuery();
        try {
            const r = await fetch('/api/companion/select?' + q.toString(), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ companionId: detail.id, source: 'portal' }),
            });
            const data = await r.json().catch(() => ({}));
            if (r.ok && data.success) {
                currentSelectionId = detail.id;
                alert(t('petdx_switch_success', { name: detail.name }));
            } else {
                alert(t('petdx_switch_failed', { error: data.error || r.status }));
            }
        } catch (err) {
            alert(t('petdx_network_error', { error: err.message }));
        }
    }

    async function onFavorite(detail, btn) {
        const q = authQuery();
        try {
            const r = await fetch('/api/companion/' + encodeURIComponent(detail.id) + '/favorite?' + q.toString(), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'toggle' }),
            });
            const data = await r.json().catch(() => ({}));
            if (r.ok && data.success) {
                if (data.favorited) favoriteIds.add(detail.id);
                else favoriteIds.delete(detail.id);
                if (btn) btn.textContent = data.favorited ? '★ 已收藏' : '☆ 收藏';
            } else {
                alert(t('petdx_favorite_failed', { error: data.error || r.status }));
            }
        } catch (err) {
            alert(t('petdx_network_error', { error: err.message }));
        }
    }

    function closeModal() {
        document.getElementById('modal').classList.remove('open');
        if (modalRenderer) { modalRenderer.stop(); modalRenderer = null; }
    }
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal').addEventListener('click', (e) => {
        if (e.target.id === 'modal') closeModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    // ── Search input ─────────────────────────────────────────────
    document.getElementById('search').addEventListener('input', (e) => {
        searchTerm = e.target.value.trim();
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            currentPage = 1;
            loadList();
        }, 250);
    });

    // ── Entity selector ──────────────────────────────────────────
    // Owner can pick *which* entity's companion they're swapping. The list
    // comes from /api/entities; same-device entities only, since cross-device
    // selection requires that device's secret. Bot-auth (botSecret only)
    // callers are locked to their bound entity — the dropdown is disabled.
    async function loadEntities() {
        const sel = document.getElementById('entity-selector');
        const creds = getCreds();
        if (creds.botSecret && !creds.deviceSecret) {
            // Bot auth: locked to bound entity, can't switch
            sel.innerHTML = '<option value="' + escapeHtml(creds.entityId) + '">🔒 Entity #' + escapeHtml(creds.entityId) + ' (bot 綁定)</option>';
            sel.disabled = true;
            return;
        }
        try {
            const q = new URLSearchParams();
            q.set('deviceId', creds.deviceId);
            if (creds.deviceSecret) q.set('deviceSecret', creds.deviceSecret);
            const r = await fetch('/api/entities?' + q.toString());
            const data = await r.json();
            const list = Array.isArray(data) ? data : (data.entities || []);
            // Keep the default "device-wide" option, then append every entity
            sel.innerHTML = '<option value="">🖥️ 全裝置 / Device-wide</option>';
            list.forEach(e => {
                const id = e.entityId != null ? e.entityId : e.id;
                if (id == null) return;
                const name = e.name || ('Entity #' + id);
                const code = e.publicCode ? ' · ' + e.publicCode : '';
                const opt = document.createElement('option');
                opt.value = String(id);
                opt.textContent = '#' + id + ' ' + name + code;
                sel.appendChild(opt);
            });
            sel.value = activeEntityId || '';
        } catch (err) {
            // Non-fatal: leave the default device-wide option in place.
        }
    }

    document.getElementById('entity-selector').addEventListener('change', (e) => {
        activeEntityId = e.target.value || '';
        if (activeEntityId) {
            localStorage.setItem(ACTIVE_ENTITY_KEY, activeEntityId);
        } else {
            localStorage.removeItem(ACTIVE_ENTITY_KEY);
        }
        // mine-scope filtering is tied to entityId — re-apply both list and
        // owner-state so the "✓ 目前選用" badge tracks the new scope.
        currentPage = 1;
        loadList();
        refreshOwnerState();
    });

    // ── Helpers ──────────────────────────────────────────────────
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
        }[c]));
    }

    // ── Boot ─────────────────────────────────────────────────────
    // Cookie-session fallback: other portal pages (dashboard/chat/mission)
    // trust the device-login cookie. Petdx historically only read URL or
    // localStorage, so a freshly logged-in user (no localStorage seed) saw
    // "尚未登入". Ask /api/auth/me once and persist creds to localStorage so
    // the existing sync getCreds() path keeps working.
    async function bootstrapCookieSession() {
        const url = new URLSearchParams(location.search);
        const hasUrl = !!url.get('deviceId') && (!!url.get('deviceSecret') || !!url.get('botSecret'));
        const hasLocal = !!localStorage.getItem('eclaw_device_id')
            && !!localStorage.getItem('eclaw_device_secret');
        if (hasUrl || hasLocal) return;
        try {
            const r = await fetch('/api/auth/me', { credentials: 'include' });
            if (!r.ok) return;
            const j = await r.json();
            if (j && j.success && j.user && j.user.deviceId && j.user.deviceSecret) {
                localStorage.setItem('eclaw_device_id', j.user.deviceId);
                localStorage.setItem('eclaw_device_secret', j.user.deviceSecret);
            }
        } catch (e) { /* swallow — login warn surfaces if creds still absent */ }
    }

    (async function init() {
        await bootstrapCookieSession();

        // Seed activeEntityId from URL (?entityId=) then localStorage. URL wins
        // so a deep-link like ".../petdx-browser.html?entityId=3" lands you on
        // that entity's scope without needing the dropdown.
        const c = getCreds();
        const stored = localStorage.getItem(ACTIVE_ENTITY_KEY) || '';
        activeEntityId = c.entityId || stored || '';

        // Restore page from ?page= URL param so a shared deep link lands the
        // viewer on the same page the linker saw. Clamped to >=1; out-of-range
        // values are corrected after the first fetch (see loadList clamp).
        const urlPage = parseInt(new URLSearchParams(location.search).get('page'), 10);
        if (Number.isFinite(urlPage) && urlPage >= 1) currentPage = urlPage;

        renderFilters();
        loadEntities();
        loadList();
        refreshOwnerState();
    })();
}());
</script>
</body>
</html>
