<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="nav_split_view">EClawbot - Split View</title>
    <link rel="icon" type="image/png" href="assets/favicon-32.png">
    <link rel="stylesheet" href="shared/style.css">
    <style>
        .workspace-container {
            display: flex;
            height: calc(100vh - 56px);
            overflow: hidden;
        }
        .workspace-pane {
            border: none;
            height: 100%;
            min-width: 180px;
            background: var(--bg);
            flex-shrink: 0;
        }

        /* Draggable divider */
        .workspace-divider {
            width: 6px;
            cursor: col-resize;
            background: var(--card-border, #2a2a3e);
            flex-shrink: 0;
            position: relative;
            transition: background 0.15s;
            z-index: 10;
        }
        .workspace-divider:hover,
        .workspace-divider.dragging { background: var(--accent, #7c6aef); }
        .workspace-divider::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 2px; height: 32px;
            border-radius: 1px;
            background: var(--text-muted, #666);
            opacity: 0.5;
        }
        .workspace-divider:hover::after,
        .workspace-divider.dragging::after { opacity: 1; background: #fff; }

        /* Overlay to capture mouse during divider drag */
        .drag-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 9;
            cursor: col-resize;
        }

        /* Pane label tabs */
        .pane-labels {
            display: flex;
            height: 34px;
            background: var(--card-bg, #1a1a2e);
            border-bottom: 1px solid var(--card-border, #2a2a3e);
            align-items: center;
            padding: 0 6px;
            gap: 2px;
            font-size: 12px;
            overflow-x: auto;
        }
        .pane-label {
            padding: 5px 10px;
            border-radius: 6px 6px 0 0;
            color: var(--text-muted, #888);
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            user-select: none;
            border: 1px solid transparent;
            border-bottom: none;
            transition: background 0.15s, border-color 0.15s;
        }
        .pane-label:hover { background: rgba(255,255,255,0.05); }
        .pane-label.active { background: var(--accent, #7c6aef); color: #fff; }
        .pane-label.drag-over {
            border-color: var(--accent, #7c6aef);
            background: rgba(124,106,239,0.15);
        }
        .pane-label .pane-close {
            cursor: pointer;
            opacity: 0.5;
            font-size: 14px;
            line-height: 1;
            margin-left: 2px;
        }
        .pane-label .pane-close:hover { opacity: 1; }

        /* Active tab highlights in nav */
        .nav-link.active-pane { border-bottom: 2px solid var(--accent, #7c6aef); }

        @media (max-width: 768px) {
            .pane-labels {
                height: auto;
                min-height: 38px;
                padding: 6px 8px 4px;
                gap: 6px;
            }
            .pane-label {
                cursor: pointer;
            }
            .workspace-container {
                height: calc(100vh - 94px);
            }
            .workspace-pane {
                min-width: 100%;
                width: 100% !important;
            }
            .workspace-divider,
            .drag-overlay {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="pane-labels" id="paneLabels"></div>
    <div class="workspace-container" id="workspaceContainer"></div>
    <div class="drag-overlay" id="dragOverlay"></div>

    <script src="../shared/i18n.js"></script>
    <script src="../shared/transition-overlay.js"></script>
    <script src="shared/api.js"></script>
    <script src="shared/nav.js"></script>
    <script src="shared/auth.js"></script>
    <script src="shared/footer.js"></script>
    <script src="../shared/telemetry.js"></script>
    <script src="shared/ai-chat.js"></script>
    <script src="/shared-core/route-registry.js"></script>
    <script>
    const PAGES = {
        'dashboard':   { href: 'dashboard.html',   icon: '📊', label: 'Dashboard',  i18nKey: 'nav_dashboard' },
        'chat':        { href: 'chat.html',         icon: '💬', label: 'Chat',       i18nKey: 'nav_chat' },
        'mission':     { href: 'mission.html',      icon: '🚀', label: 'Mission',    i18nKey: 'nav_mission' },
        'kanban':      { href: 'kanban.html',       icon: '📋', label: 'Kanban',     i18nKey: 'nav_kanban' },
        'card-holder': { href: 'card-holder.html',  icon: '🗂️', label: 'Cards',     i18nKey: 'nav_card_holder' },
        'community':   { href: 'community.html',    icon: '🏪', label: 'Community',  i18nKey: 'nav_community' },
        'marketplace': { href: 'marketplace.html',  icon: '🤝', label: 'Marketplace', i18nKey: 'nav_marketplace' },
        'settings':    { href: 'settings.html',     icon: '⚙️', label: 'Settings',  i18nKey: 'nav_settings' },
        'info':        { href: 'info.html',         icon: '📖', label: 'Info',       i18nKey: 'nav_info' },
        'admin':       { href: 'admin.html',        icon: '🔒', label: 'Admin',      i18nKey: 'nav_admin' }
    };

    const COLORS = ['#7c6aef','#4CAF50','#FF9800','#E91E63','#00BCD4','#9C27B0','#CDDC39','#FF5722'];

    // ── State: ordered array of panes ──
    let panes = [];   // [{ id: 'chat', width: 0.5 }, ...]
    let activePaneIdx = 0;
    let _lastMobileMode = null;

    function t(key, fb) { return typeof i18n !== 'undefined' ? i18n.t(key) : fb; }
    function isMobileWorkspace() { return window.matchMedia('(max-width: 768px)').matches; }
    function clampActivePaneIdx() {
        if (panes.length === 0) activePaneIdx = 0;
        else activePaneIdx = Math.max(0, Math.min(activePaneIdx, panes.length - 1));
    }

    function pageIdFromHref(href) {
        for (const [id, p] of Object.entries(PAGES)) { if (p.href === href) return id; }
        return href.replace('.html', '');
    }

    // ── Init ──
    function initWorkspace() {
        renderNav('workspace');

        const params = new URLSearchParams(window.location.search);
        const paneParam = params.get('panes'); // e.g. "chat,mission,dashboard"
        const leftParam = params.get('left');  // backwards compat

        if (paneParam) {
            const ids = paneParam.split(',').filter(id => PAGES[id]);
            const w = 1 / (ids.length || 1);
            panes = ids.map(id => ({ id, width: w }));
        } else if (leftParam) {
            panes = [{ id: leftParam, width: 1 }];
            const rightParam = params.get('right');
            if (rightParam && PAGES[rightParam]) {
                panes = [{ id: leftParam, width: 0.5 }, { id: rightParam, width: 0.5 }];
            }
        }

        if (panes.length === 0) panes = [{ id: 'dashboard', width: 1 }];
        activePaneIdx = 0;
        _lastMobileMode = isMobileWorkspace();

        // Restore widths from localStorage
        try {
            const saved = JSON.parse(localStorage.getItem('eclaw-workspace-widths') || 'null');
            if (saved && saved.length === panes.length) {
                panes.forEach((p, i) => { p.width = saved[i]; });
            }
        } catch (e) {}

        // Intercept nav link clicks
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                handleNavClick(pageIdFromHref(link.getAttribute('href')));
            });
        });

        render();

        if (typeof telemetry !== 'undefined') telemetry.trackPageView('workspace');
    }

    // ── Nav click logic ──
    function handleNavClick(pageId) {
        if (!PAGES[pageId]) return;
        const idx = panes.findIndex(p => p.id === pageId);
        if (idx >= 0) {
            if (isMobileWorkspace()) {
                activePaneIdx = idx;
                render();
                return;
            }
            // Already open — close it (unless it's the only one)
            if (panes.length <= 1) return;
            panes.splice(idx, 1);
            normalizeWidths();
        } else {
            // Add new pane at the left
            panes.unshift({ id: pageId, width: 0 });
            activePaneIdx = 0;
            normalizeWidths();
        }
        clampActivePaneIdx();
        render();
    }

    function normalizeWidths() {
        const w = 1 / panes.length;
        panes.forEach(p => { p.width = w; });
    }

    // ── Render everything ──
    function render() {
        renderContainer();
        renderLabels();
        updateNavHighlights();
        updateUrl();
        saveState();
    }

    function renderContainer() {
        bustChatPaneCache();
        clampActivePaneIdx();
        const container = document.getElementById('workspaceContainer');
        const mobileMode = isMobileWorkspace();
        container.innerHTML = '';

        const panesToRender = mobileMode
            ? [{ pane: panes[activePaneIdx], paneIndex: activePaneIdx }]
            : panes.map((pane, i) => ({ pane, paneIndex: i }));

        panesToRender.forEach(({ pane, paneIndex }, renderIdx) => {
            if (!pane) return;
            const iframe = document.createElement('iframe');
            iframe.className = 'workspace-pane';
            iframe.id = 'pane-' + paneIndex;
            iframe.style.width = mobileMode ? '100%' : (pane.width * 100).toFixed(2) + '%';
            const pageInfo = PAGES[pane.id];
            if (pageInfo) iframe.src = pageInfo.href + '?embed=1';
            container.appendChild(iframe);

            if (!mobileMode && renderIdx < panesToRender.length - 1) {
                const div = document.createElement('div');
                div.className = 'workspace-divider';
                div.setAttribute('data-index', paneIndex);
                div.addEventListener('mousedown', startDividerDrag);
                container.appendChild(div);
            }
        });
    }

    // ── Divider drag ──
    let dragIndex = -1;

    function startDividerDrag(e) {
        if (isMobileWorkspace()) return;
        e.preventDefault();
        dragIndex = parseInt(e.target.getAttribute('data-index'));
        e.target.classList.add('dragging');
        document.getElementById('dragOverlay').style.display = 'block';

        const onMove = (ev) => {
            if (dragIndex < 0) return;
            const container = document.getElementById('workspaceContainer');
            const rect = container.getBoundingClientRect();
            const totalW = rect.width - (panes.length - 1) * 6; // subtract divider widths

            // Calculate mouse position relative to the start of pane[dragIndex]
            let offsetBefore = 0;
            for (let j = 0; j < dragIndex; j++) {
                offsetBefore += panes[j].width * totalW + 6;
            }
            const combinedW = (panes[dragIndex].width + panes[dragIndex + 1].width) * totalW;
            const mouseInCombined = (ev.clientX - rect.left) - offsetBefore;
            const ratio = Math.max(0.1, Math.min(0.9, mouseInCombined / combinedW));

            const totalShare = panes[dragIndex].width + panes[dragIndex + 1].width;
            panes[dragIndex].width = totalShare * ratio;
            panes[dragIndex + 1].width = totalShare * (1 - ratio);

            // Update widths directly (no full re-render to avoid iframe reload)
            panes.forEach((p, i) => {
                const el = document.getElementById('pane-' + i);
                if (el) el.style.width = (p.width * 100).toFixed(2) + '%';
            });
        };

        const onUp = () => {
            document.querySelectorAll('.workspace-divider.dragging').forEach(d => d.classList.remove('dragging'));
            document.getElementById('dragOverlay').style.display = 'none';
            dragIndex = -1;
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            saveState();
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
    }

    // ── Pane label tabs (draggable to reorder) ──
    let dragLabelIdx = -1;

    function renderLabels() {
        const bar = document.getElementById('paneLabels');
        const mobileMode = isMobileWorkspace();
        clampActivePaneIdx();
        bar.innerHTML = '';

        panes.forEach((pane, i) => {
            const span = document.createElement('span');
            span.className = 'pane-label' + ((mobileMode ? i === activePaneIdx : i === 0) ? ' active' : '');
            span.style.borderBottomColor = COLORS[i % COLORS.length];
            span.style.borderBottom = '2px solid ' + COLORS[i % COLORS.length];
            span.setAttribute('draggable', mobileMode ? 'false' : 'true');
            span.setAttribute('data-idx', i);

            const p = PAGES[pane.id];
            const icon = p ? p.icon : '';
            const label = p ? t(p.i18nKey, p.label) : pane.id;
            span.innerHTML = `${icon} ${label}`;

            span.addEventListener('click', () => {
                if (!mobileMode) return;
                activePaneIdx = i;
                render();
            });

            // Close button (only if more than 1 pane)
            if (panes.length > 1) {
                const close = document.createElement('span');
                close.className = 'pane-close';
                close.textContent = '×';
                close.title = t('workspace_close_pane', 'Close Pane');
                close.addEventListener('click', (e) => { e.stopPropagation(); removePane(i); });
                span.appendChild(close);
            }

            if (!mobileMode) {
                // Drag to reorder
                span.addEventListener('dragstart', (e) => {
                    dragLabelIdx = i;
                    e.dataTransfer.effectAllowed = 'move';
                    span.style.opacity = '0.5';
                });
                span.addEventListener('dragend', () => {
                    span.style.opacity = '';
                    dragLabelIdx = -1;
                    bar.querySelectorAll('.pane-label').forEach(el => el.classList.remove('drag-over'));
                });
                span.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    span.classList.add('drag-over');
                });
                span.addEventListener('dragleave', () => { span.classList.remove('drag-over'); });
                span.addEventListener('drop', (e) => {
                    e.preventDefault();
                    span.classList.remove('drag-over');
                    if (dragLabelIdx < 0 || dragLabelIdx === i) return;
                    const moved = panes.splice(dragLabelIdx, 1)[0];
                    panes.splice(i, 0, moved);
                    render();
                });
            }

            bar.appendChild(span);
        });
    }

    function removePane(idx) {
        if (panes.length <= 1) return;
        panes.splice(idx, 1);
        if (activePaneIdx >= panes.length) activePaneIdx = panes.length - 1;
        clampActivePaneIdx();
        normalizeWidths();
        render();
    }

    // ── Nav highlights ──
    function updateNavHighlights() {
        const openIds = new Set(panes.map(p => p.id));
        document.querySelectorAll('.nav-link').forEach(link => {
            const href = link.getAttribute('href');
            if (!href) return;
            const pid = pageIdFromHref(href);
            link.classList.toggle('active-pane', openIds.has(pid));
            link.classList.toggle('active', openIds.has(pid));
        });
    }

    // ── URL & persistence ──
    function updateUrl() {
        const ids = panes.map(p => p.id).join(',');
        history.replaceState(null, '', 'workspace.html?panes=' + encodeURIComponent(ids));
    }

    function saveState() {
        localStorage.setItem('eclaw-workspace-widths', JSON.stringify(panes.map(p => p.width)));
        localStorage.setItem('eclaw-workspace-panes', panes.map(p => p.id).join(','));
    }

    // ── Listen for view mode change ──
    window.addEventListener('storage', (e) => {
        if (e.key === 'eclaw-view-mode' && e.newValue === 'single') {
            window.location.href = (panes[0]?.id || 'dashboard') + '.html';
        }
    });

    window.addEventListener('resize', () => {
        const mobileMode = isMobileWorkspace();
        if (mobileMode === _lastMobileMode) return;
        _lastMobileMode = mobileMode;
        if (!mobileMode) activePaneIdx = 0;
        clampActivePaneIdx();
        render();
    });

    // ── Cross-pane quote routing ──
    // Cache avoids repeated querySelector on every message; reset on re-render.
    let _cachedChatPane = null;
    function _getChatPane() {
        if (_cachedChatPane && document.contains(_cachedChatPane)) return _cachedChatPane;
        _cachedChatPane = Array.from(document.querySelectorAll('iframe.workspace-pane'))
            .find(f => f.src && f.src.includes('chat.html')) || null;
        return _cachedChatPane;
    }
    // Expose so renderContainer() can bust the cache on pane re-render.
    function bustChatPaneCache() { _cachedChatPane = null; }

    window.addEventListener('message', (e) => {
        if (e.origin !== window.location.origin) return;
        if (!e.data) return;
        if (e.data.type === 'eclaw_quote') {
            const chatPane = _getChatPane();
            if (chatPane) {
                chatPane.contentWindow.postMessage(e.data, window.location.origin);
            } else {
                // Fallback: chat pane not open — persist so it picks up on next open
                localStorage.setItem('eclaw_pending_quote', JSON.stringify({ ...e.data, ts: Date.now() }));
            }
            return;
        }
        if (e.data.type === 'eclaw_requote') {
            // Smart-chip 📌 from a non-chat pane — forward to chat pane if open.
            const chatPane = _getChatPane();
            if (chatPane) chatPane.contentWindow.postMessage(e.data, window.location.origin);
            return;
        }
        if (e.data.type === 'split_navigate') {
            // SmartRouter split dispatch (smart-router.js §3 ack contract).
            // Identify the requesting pane by event.source — NEVER by src matching
            // (duplicate pages break that). Ack BEFORE the swap unloads the pane.
            handleSplitNavigate(e);
            return;
        }
    });

    // SmartRouter target → workspace page-id of the pane that should own it.
    // Cross-pane targets (a chat card → kanban) must land in the EXISTING
    // sibling pane, NOT swap the requester's own pane (card_2d5fbe88: split
    // "在看板中開啟" was spawning a 2nd task pane + redirecting chat).
    const TARGET_PANE = { card: 'kanban', note: 'mission' };

    // Drive an already-loaded pane to focus the target IN PLACE (no src reload,
    // no flash) by replaying the native-navigate intent that kanban/mission both
    // implement. Returns true if the pane accepted the intent.
    function _focusPaneInPlace(pane, target, params) {
        try {
            const win = pane && pane.contentWindow;
            const fn = win && win.eclawHandleNativeNavigateIntent;
            if (typeof fn !== 'function') return false;
            const pageId = TARGET_PANE[target];
            const targetTab = pageId === 'kanban' || pageId === 'mission' ? 'mission' : pageId;
            const intent = Object.assign({ targetTab: targetTab, target: target }, params || {});
            const r = fn(intent);
            // Handler may be async (returns a Promise) — treat a truthy/Promise
            // return as accepted; only an explicit synchronous `false` is a reject.
            return r !== false;
        } catch (_) { return false; }
    }

    function _findPaneByPageId(pageId) {
        const info = PAGES[pageId];
        if (!info) return null;
        return Array.from(document.querySelectorAll('iframe.workspace-pane'))
            .find(f => f.src && f.src.includes(info.href)) || null;
    }

    // Route a SmartRouter split dispatch. Cross-pane targets go to the sibling
    // pane (open it if absent); same-pane targets swap the requester in place.
    // Acks the requester FIRST so its 300ms degrade timer is cancelled and it
    // never falls back to a full-page navigate (which redirected the chat pane).
    function handleSplitNavigate(e) {
        const { requestId, target, params } = e.data;
        const requester = Array.from(document.querySelectorAll('iframe.workspace-pane'))
            .find(f => f.contentWindow === e.source);
        const url = (window.EClawRouteRegistry && buildPaneUrl(target, params)) || null;
        if (!requester || !url) return; // unknown target / orphan source → requester's timer degrades it

        const ack = () => {
            if (requestId && e.source) {
                try { e.source.postMessage({ type: 'split_navigate_ack', requestId }, window.location.origin); } catch (_) {}
            }
        };

        const destPageId = TARGET_PANE[target];
        const requesterIsDest = destPageId && PAGES[destPageId] && requester.src
            && requester.src.includes(PAGES[destPageId].href);

        // Cross-pane: target belongs in a sibling pane (e.g. chat card → kanban).
        if (destPageId && !requesterIsDest) {
            ack(); // requester keeps its own page; cancel its degrade timer now.
            let destPane = _findPaneByPageId(destPageId);
            if (destPane) {
                // Pane already open — focus the card in place (no reload, no flash).
                if (_focusPaneInPlace(destPane, target, params)) {
                    bustChatPaneCache();
                    return;
                }
                // Handler unavailable (pane mid-load) → set src so its boot deep-links.
                destPane.src = url;
                bustChatPaneCache();
                return;
            }
            // Sibling pane not open — add it, pre-pointed at the target URL.
            _openPaneWithUrl(destPageId, url);
            bustChatPaneCache();
            return;
        }

        // Same-pane (or non-cross-pane) target: swap the requester in place.
        ack();
        bustChatPaneCache();
        requester.src = url;
    }

    // Inject embed=1 into the QUERY (before any #hash) so panes boot in embed mode
    // without corrupting a deep-link fragment like kanban.html?card=X#X.
    function _withEmbed(url) {
        const hashAt = url.indexOf('#');
        const base = hashAt >= 0 ? url.slice(0, hashAt) : url;
        const frag = hashAt >= 0 ? url.slice(hashAt) : '';
        const sep = base.indexOf('?') >= 0 ? '&' : '?';
        return base + sep + 'embed=1' + frag;
    }

    // Add a new pane for pageId and point its iframe at an explicit URL (carrying
    // ?card=… deep-link), rather than the default PAGES[pageId].href.
    function _openPaneWithUrl(pageId, url) {
        if (!PAGES[pageId]) return;
        if (panes.findIndex(p => p.id === pageId) >= 0) {
            // Already a pane for this page (src mismatch) — re-point + focus it.
            render();
            const pane = _findPaneByPageId(pageId);
            if (pane) pane.src = _withEmbed(url);
            return;
        }
        panes.push({ id: pageId, width: 0 });
        activePaneIdx = panes.length - 1;
        normalizeWidths();
        clampActivePaneIdx();
        render();
        // After render the iframe exists with the default href; re-point to the
        // deep-link URL so the card opens on first boot.
        const pane = _findPaneByPageId(pageId);
        if (pane) pane.src = _withEmbed(url);
    }

    // Mirror SmartRouter.buildUrl's tolerant-degrade: strict registry URL, else bare path.
    function buildPaneUrl(target, params) {
        const reg = window.EClawRouteRegistry;
        if (!reg || !reg.isKnownTarget(target)) return null;
        try { return reg.buildWebUrl(target, params || {}); }
        catch (_) { return reg.ROUTES[target].web.split(/[?#]/)[0]; }
    }

    document.addEventListener('DOMContentLoaded', initWorkspace);
    </script>
</body>
</html>
