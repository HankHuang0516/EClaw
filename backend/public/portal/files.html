<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title data-i18n="files_title">EClawbot - Files</title>
    <meta name="description" content="EClawbot file manager for device storage.">
    <link rel="icon" type="image/png" href="assets/favicon-32.png">
    <link rel="stylesheet" href="shared/style.css">
    <link rel="canonical" href="https://eclawbot.com/portal/files.html">
    <style>
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .header-actions {
            display: flex;
            gap: 4px;
        }

        .view-btn {
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .view-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .view-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        /* Filter bar */
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
            align-items: center;
        }

        #entityFilters {
            display: contents;
        }

        .filter-chip {
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            cursor: pointer;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            transition: all 0.2s;
            white-space: nowrap;
            user-select: none;
        }

        .filter-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--text);
        }

        .filter-divider {
            width: 1px;
            height: 20px;
            background: var(--card-border);
            margin: 0 4px;
        }

        /* Time filter row */
        .time-filter-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            align-items: center;
        }

        .time-chip {
            padding: 4px 12px;
            border-radius: var(--radius);
            font-size: 11px;
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            transition: all 0.2s;
            white-space: nowrap;
            user-select: none;
        }

        .time-chip:hover {
            border-color: var(--text-secondary);
            color: var(--text-secondary);
        }

        .time-chip.active {
            background: rgba(108, 99, 255, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Folder filter row */
        .folder-filter-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            align-items: center;
        }

        .folder-chip {
            padding: 4px 12px;
            border-radius: var(--radius);
            font-size: 11px;
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            transition: all 0.2s;
            white-space: nowrap;
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .folder-chip:hover {
            border-color: var(--text-secondary);
            color: var(--text-secondary);
        }

        .folder-chip.active {
            background: rgba(108, 99, 255, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        .folder-chip .folder-close {
            font-size: 10px;
            opacity: 0.5;
            cursor: pointer;
            margin-left: 2px;
        }

        .folder-chip .folder-close:hover {
            opacity: 1;
            color: var(--error, #e53e3e);
        }

        .folder-add-btn {
            padding: 4px 12px;
            border-radius: var(--radius);
            font-size: 11px;
            cursor: pointer;
            background: transparent;
            border: 1px dashed var(--card-border);
            color: var(--text-muted);
            transition: all 0.2s;
            white-space: nowrap;
        }

        .folder-add-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* File stats */
        .file-stats {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .file-stats strong {
            color: var(--primary);
        }

        .file-result-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 0 14px;
            padding: 10px 12px;
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            background: color-mix(in srgb, var(--card) 76%, transparent);
        }

        .file-result-summary {
            font-size: 13px;
            color: var(--text);
            font-weight: 600;
        }

        .file-active-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
            min-height: 0;
        }

        .file-active-filter {
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 3px 8px;
            border-radius: var(--radius-pill);
            background: rgba(14, 165, 233, 0.12);
            border: 1px solid rgba(14, 165, 233, 0.35);
            color: var(--text-secondary);
            font-size: 11px;
        }

        #clearFileFilters:disabled {
            opacity: 0.45;
            cursor: default;
        }

        /* File grid */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .file-card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            /* Suppress iOS save-image callout during the long-press detection
             * window. Without this, a 500ms hold on a photo thumbnail pops the
             * system share sheet before our multi-select timer can fire. */
            -webkit-touch-callout: none;
        }

        .file-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108, 99, 255, 0.15);
        }

        /* Photo thumbnail */
        .file-thumb {
            width: 100%;
            aspect-ratio: 1;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .file-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-thumb-icon {
            font-size: 40px;
            opacity: 0.5;
        }

        /* Delete button on file card */
        .file-delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .file-card:hover .file-delete-btn {
            display: flex;
        }
        .file-delete-btn:hover {
            background: var(--error, #e53e3e);
        }
        .file-quote-btn {
            position: absolute;
            top: 6px;
            right: 40px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 13px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .file-card:hover .file-quote-btn {
            display: flex;
        }
        .file-quote-btn:hover {
            background: var(--primary, #4a90d9);
        }

        /* Multi-entity badge overlay on thumbnail */
        .entity-badges {
            position: absolute;
            top: 6px;
            left: 6px;
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
        }

        .entity-badge {
            background: rgba(0, 0, 0, 0.6);
            border-radius: var(--radius);
            padding: 2px 6px;
            font-size: 11px;
            line-height: 1.2;
            backdrop-filter: blur(4px);
        }

        .broadcast-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(108, 99, 255, 0.85);
            color: #fff;
            border-radius: var(--radius);
            padding: 2px 8px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }

        /* File info below thumb */
        .file-info {
            padding: 10px 12px;
        }

        .file-type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: var(--radius);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .file-type-badge.photo {
            background: rgba(76, 175, 80, 0.2);
            color: var(--success);
        }

        .file-type-badge.voice {
            background: rgba(108, 99, 255, 0.2);
            color: var(--primary);
        }

        .file-entity {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .file-source {
            font-size: 11px;
            color: var(--text-muted);
        }

        .file-date {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .file-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        /* ===== List View ===== */
        .file-grid.list-view {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-grid.list-view .file-card {
            display: flex;
            flex-direction: row;
            align-items: stretch;
        }

        .file-grid.list-view .file-thumb {
            width: 80px;
            min-width: 80px;
            aspect-ratio: 1;
            flex-shrink: 0;
        }

        .file-grid.list-view .file-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 8px 12px;
        }

        .file-grid.list-view .file-card:hover {
            transform: none;
        }

        .file-grid.list-view .entity-badges {
            top: 4px;
            left: 4px;
        }

        .file-grid.list-view .broadcast-badge {
            top: 4px;
            right: 4px;
            font-size: 8px;
            padding: 1px 6px;
        }

        /* Load more */
        .load-more-container {
            text-align: center;
            padding: 16px 0;
        }

        /* Preview overlay */
        .preview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            padding: 20px;
        }

        .preview-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .preview-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .preview-content {
            max-width: 90vw;
            max-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-content img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .preview-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .preview-meta {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }

        /* Audio player in preview */
        .audio-player {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            min-width: 300px;
        }

        .audio-player-icon {
            font-size: 48px;
        }

        .audio-player audio {
            width: 100%;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .page-header {
                align-items: flex-start;
                gap: 12px;
            }

            .file-result-panel {
                align-items: stretch;
                flex-direction: column;
            }

            #clearFileFilters {
                width: 100%;
                justify-content: center;
            }

            .file-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 8px;
            }

            .preview-actions {
                flex-direction: column;
                width: 100%;
            }

            .preview-actions .btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* ===== Multi-select mode ===== */
        body.multi-select-mode {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body.multi-select-mode .file-card:hover {
            transform: none;
            box-shadow: none;
        }
        body.multi-select-mode .file-card::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #fff;
            z-index: 3;
            transition: background 0.15s;
        }
        body.multi-select-mode .file-card.selected::after {
            background: var(--primary, #6c63ff);
            border-color: var(--primary, #6c63ff);
            content: '\2713';
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        body.multi-select-mode .file-card.selected {
            outline: 2px solid var(--primary, #6c63ff);
            outline-offset: -2px;
        }
        body.multi-select-mode .file-delete-btn,
        body.multi-select-mode .file-quote-btn {
            display: none !important;
        }

        .multi-select-bar {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--card, #222);
            border: 1px solid var(--card-border, #333);
            border-radius: 999px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            z-index: 250;
            max-width: calc(100vw - 24px);
        }
        .multi-select-bar .ms-count {
            color: var(--text, #eee);
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }
        @media (max-width: 480px) {
            .multi-select-bar {
                left: 12px;
                right: 12px;
                transform: none;
                bottom: 16px;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>
    <main>
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title" data-i18n="files_title">Files</h1>
            <div class="header-actions">
                <button class="view-btn active" id="btnGridView" onclick="setViewMode('grid')" title="Grid">&#9638;</button>
                <button class="view-btn" id="btnListView" onclick="setViewMode('list')" title="List">&#9776;</button>
            </div>
        </div>

        <!-- Filter Bar: Type + Entity -->
        <div class="filter-bar">
            <div class="filter-chip active" data-type="all" onclick="setFilter('all')" data-i18n="files_filter_all">All</div>
            <div class="filter-chip" data-type="photo" onclick="setFilter('photo')">
                <span data-i18n="files_filter_photos">Photos</span>
            </div>
            <div class="filter-chip" data-type="voice" onclick="setFilter('voice')">
                <span data-i18n="files_filter_voice">Voice</span>
            </div>
            <div class="filter-divider"></div>
            <div id="entityFilters"></div>
        </div>

        <!-- Time Filter Bar -->
        <div class="time-filter-bar">
            <div class="time-chip active" data-time="all" onclick="setTimeFilter('all')" data-i18n="files_time_all">All time</div>
            <div class="time-chip" data-time="today" onclick="setTimeFilter('today')" data-i18n="files_time_today">Today</div>
            <div class="time-chip" data-time="week" onclick="setTimeFilter('week')" data-i18n="files_time_week">This week</div>
            <div class="time-chip" data-time="month" onclick="setTimeFilter('month')" data-i18n="files_time_month">This month</div>
        </div>

        <!-- Folder Filter Bar -->
        <div class="folder-filter-bar" id="folderFilterBar">
            <div class="folder-chip active" data-folder="all" onclick="setFolderFilter('all')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" role="button" tabindex="0" data-i18n="files_folder_all">All</div>
            <!-- dynamic folder chips + add button rendered by JS -->
        </div>

        <!-- Stats -->
        <div class="file-stats" id="fileStats">
            <div class="spinner" style="width:14px;height:14px;border-width:2px;vertical-align:middle;display:inline-block;"></div>
            <span data-i18n="files_loading">Loading files...</span>
        </div>

        <div class="file-result-panel" id="fileResultPanel" role="status" aria-live="polite">
            <div>
                <div class="file-result-summary" id="fileResultSummary">
                    <span data-i18n="files_loading">Loading files...</span>
                </div>
                <div class="file-active-filters" id="fileActiveFilters"></div>
            </div>
            <button class="btn btn-outline btn-sm" id="clearFileFilters" type="button" onclick="clearFileFilters()" data-i18n="community_result_clear_filters" disabled>Clear filters</button>
        </div>

        <!-- File Grid -->
        <div class="file-grid" id="fileGrid">
            <div class="empty-state" id="loadingState">
                <div class="spinner" style="margin: 0 auto 12px;"></div>
                <div data-i18n="files_loading">Loading files...</div>
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <div style="font-size:48px;margin-bottom:12px;">📁</div>
            <div id="emptyTitle" style="font-size:16px;color:var(--text-secondary);margin-bottom:4px;" data-i18n="files_empty_title">No files yet</div>
            <div id="emptyDesc" data-i18n="files_empty_desc">Photos and voice messages from your chats will appear here.</div>
            <button class="btn btn-outline btn-sm" id="emptyClearFileFilters" type="button" onclick="clearFileFilters()" data-i18n="community_result_clear_filters" style="display:none;margin-top:12px;">Clear filters</button>
        </div>

        <!-- Load More -->
        <div class="load-more-container" id="loadMoreContainer" style="display:none;">
            <button class="btn btn-outline" id="btnLoadMore" onclick="loadMore()" data-i18n="files_load_more">Load More</button>
        </div>
    </div>

    <script>if(typeof renderAvatarHtml==='undefined'){window.renderAvatarHtml=function(a){return a||'\u{1F99E}'};window.isAvatarUrl=function(){return false}}</script>
    <script>
        // ENTITY_CHARS_DEFAULT, getAvatarForEntity, getEntityDisplayName, getEntityLabel
        // are provided by shared/entity-utils.js

        // --- State ---
        let allFiles = [];
        let currentTypeFilter = 'all';
        let currentEntityFilter = null; // null = all
        let currentTimeFilter = 'all';
        let currentFolderFilter = null; // null = all
        let currentViewMode = localStorage.getItem('eclaw_file_view') || 'grid';
        let entities = [];
        let isLoading = false;
        let hasMore = false;
        let oldestTimestamp = null;

        function tr(key, fallback) {
            const value = (typeof i18n !== 'undefined' && i18n.t) ? i18n.t(key) : key;
            return value && value !== key ? value : (fallback || key);
        }

        // --- Folder Management (localStorage) ---
        function getFileFolders() {
            try { return JSON.parse(localStorage.getItem('eclaw_file_folders') || '[]'); }
            catch (_) { return []; }
        }
        function saveFileFolders(folders) {
            localStorage.setItem('eclaw_file_folders', JSON.stringify(folders));
        }
        function getFileFolder(fileId) {
            return localStorage.getItem('eclaw_file_folder_' + fileId);
        }
        function setFileFolder(fileId, folder) {
            if (folder === null) {
                localStorage.removeItem('eclaw_file_folder_' + fileId);
            } else {
                localStorage.setItem('eclaw_file_folder_' + fileId, folder);
            }
        }

        function renderFolderChips() {
            const bar = document.getElementById('folderFilterBar');
            const folders = getFileFolders();
            let html = '<div class="folder-chip' + (currentFolderFilter === null ? ' active' : '') + '" data-folder="all" onclick="setFolderFilter(\'all\')" data-i18n="files_folder_all">' + tr('files_folder_all', 'All') + '</div>';
            folders.forEach(f => {
                const isActive = currentFolderFilter === f;
                html += '<div class="folder-chip' + (isActive ? ' active' : '') + '" data-folder="' + escapeHtml(f) + '" onclick="setFolderFilter(\'' + escapeHtml(f).replace(/'/g, "\\'") + '\')">' +
                    '📁 ' + escapeHtml(f) +
                    '<span class="folder-close" onclick="event.stopPropagation();deleteFolder(\'' + escapeHtml(f).replace(/'/g, "\\'") + '\')">&times;</span>' +
                    '</div>';
            });
            html += '<div class="folder-add-btn" onclick="addFolder()" data-i18n="files_folder_add">' + tr('files_folder_add', '+ Folder') + '</div>';
            bar.innerHTML = html;
        }

        function setFolderFilter(folder) {
            currentFolderFilter = folder === 'all' ? null : folder;
            renderFolderChips();
            renderFiles();
            updateStats();
        }

        function getDisplayFiles() {
            if (currentFolderFilter === null) return allFiles;
            return allFiles.filter(f => getFileFolder(f.id) === currentFolderFilter);
        }

        function hasActiveFileFilters() {
            return currentTypeFilter !== 'all'
                || currentEntityFilter !== null
                || currentTimeFilter !== 'all'
                || currentFolderFilter !== null;
        }

        function getActiveFileFilterLabels() {
            const labels = [];
            if (currentTypeFilter !== 'all') {
                labels.push(currentTypeFilter === 'photo'
                    ? tr('files_filter_photos', 'Photos')
                    : tr('files_filter_voice', 'Voice'));
            }
            if (currentEntityFilter !== null) {
                labels.push(getEntityName(currentEntityFilter));
            }
            if (currentTimeFilter !== 'all') {
                const chip = document.querySelector('.time-filter-bar .time-chip[data-time="' + currentTimeFilter + '"]');
                labels.push(chip ? chip.textContent.trim() : currentTimeFilter);
            }
            if (currentFolderFilter !== null) {
                labels.push('📁 ' + currentFolderFilter);
            }
            return labels;
        }

        function syncFilterControls() {
            document.querySelectorAll('.filter-bar > .filter-chip').forEach(c => {
                c.classList.toggle('active', c.dataset.type === currentTypeFilter);
            });
            document.querySelectorAll('.time-filter-bar .time-chip').forEach(c => {
                c.classList.toggle('active', c.dataset.time === currentTimeFilter);
            });
            renderEntityFilters();
            renderFolderChips();
        }

        function updateFileResultContext(displayFiles = getDisplayFiles()) {
            const summary = document.getElementById('fileResultSummary');
            const filters = document.getElementById('fileActiveFilters');
            const clearBtn = document.getElementById('clearFileFilters');
            const emptyTitle = document.getElementById('emptyTitle');
            const emptyDesc = document.getElementById('emptyDesc');
            const emptyClearBtn = document.getElementById('emptyClearFileFilters');
            const activeLabels = getActiveFileFilterLabels();
            const hasActive = hasActiveFileFilters();
            const photoCount = displayFiles.filter(f => f.type === 'photo').length;
            const voiceCount = displayFiles.filter(f => f.type === 'voice').length;

            if (summary) {
                summary.innerHTML = '<strong>' + displayFiles.length + '</strong> ' + tr('files_stats_total', 'files') +
                    ' — ' + photoCount + ' ' + tr('files_type_photo', 'Photo') +
                    ', ' + voiceCount + ' ' + tr('files_type_voice', 'Voice');
            }
            if (filters) {
                filters.innerHTML = activeLabels.map(label =>
                    '<span class="file-active-filter">' + escapeHtml(label) + '</span>'
                ).join('');
            }
            if (clearBtn) {
                clearBtn.disabled = !hasActive;
            }
            if (emptyTitle && emptyDesc) {
                emptyTitle.textContent = hasActive
                    ? tr('faq_no_results', 'No matching results found.')
                    : tr('files_empty_title', 'No files yet');
                emptyDesc.textContent = hasActive
                    ? activeLabels.join(' / ')
                    : tr('files_empty_desc', 'Photos and voice messages from your chats will appear here.');
            }
            if (emptyClearBtn) {
                emptyClearBtn.style.display = hasActive ? '' : 'none';
            }
        }

        function clearFileFilters() {
            const hadServerFilters = currentTypeFilter !== 'all'
                || currentEntityFilter !== null
                || currentTimeFilter !== 'all';
            currentTypeFilter = 'all';
            currentEntityFilter = null;
            currentTimeFilter = 'all';
            currentFolderFilter = null;
            syncFilterControls();
            if (hadServerFilters) {
                loadFiles();
            } else {
                renderFiles();
                updateStats();
            }
        }

        async function addFolder() {
            const name = await showPrompt({ message: i18n.t('files_folder_name_hint') });
            if (!name || !name.trim()) return;
            const trimmed = name.trim().substring(0, 50);
            const folders = getFileFolders();
            if (folders.includes(trimmed)) {
                showToast(i18n.t('files_folder_already_exists').replace('%1$s', trimmed), 'error');
                return;
            }
            folders.push(trimmed);
            saveFileFolders(folders);
            renderFolderChips();
        }

        async function deleteFolder(name) {
            if (!await showConfirm({ message: i18n.t('files_folder_delete_confirm').replace('%1$s', name), confirmText: i18n.t('common_delete'), danger: true, itemName: name })) return;
            const folders = getFileFolders().filter(f => f !== name);
            saveFileFolders(folders);
            // Remove folder assignments
            allFiles.forEach(f => { if (getFileFolder(f.id) === name) setFileFolder(f.id, null); });
            if (currentFolderFilter === name) currentFolderFilter = null;
            renderFolderChips();
            renderFiles();
            updateStats();
        }

        async function moveFileToFolder(idx) {
            const file = allFiles[idx];
            if (!file) return;
            const folders = getFileFolders();
            if (folders.length === 0) { await addFolder(); return; }
            const currentFileFolder = getFileFolder(file.id);
            const options = [];
            if (currentFileFolder) options.push(i18n.t('files_folder_remove_from'));
            folders.forEach(f => { if (f !== currentFileFolder) options.push('📁 ' + f); });
            if (options.length === 0) return;
            // Use a simple select menu
            const choice = await showPrompt({ message: i18n.t('files_folder_move_to') + '\n\n' + options.map((o, i) => (i + 1) + '. ' + o).join('\n') + '\n\n' + i18n.t('files_folder_enter_number') });
            if (!choice) return;
            const num = parseInt(choice, 10);
            if (isNaN(num) || num < 1 || num > options.length) return;
            const selected = options[num - 1];
            if (selected === i18n.t('files_folder_remove_from')) {
                setFileFolder(file.id, null);
            } else {
                const folderName = selected.replace(/^📁 /, '');
                setFileFolder(file.id, folderName);
            }
            renderFiles();
            updateStats();
        }

        // --- Init ---
        window.addEventListener('DOMContentLoaded', async () => {
            if (typeof attachAvatarClickHandler === 'function' && window.EntityStatusPanel) {
                attachAvatarClickHandler(document.body, (eid) => window.EntityStatusPanel.open(eid));
            }
            renderNav('files');
            if (typeof renderFooter === 'function') renderFooter();
            const user = await checkAuth();
            if (!user) return;
            initPortalSocket();

            // Restore view mode
            setViewMode(currentViewMode, true);

            renderFolderChips();
            await loadEntities();
            await loadFiles();
        });

        // --- View Mode ---
        function setViewMode(mode, skipRender) {
            currentViewMode = mode;
            localStorage.setItem('eclaw_file_view', mode);
            document.getElementById('btnGridView').classList.toggle('active', mode === 'grid');
            document.getElementById('btnListView').classList.toggle('active', mode === 'list');
            const grid = document.getElementById('fileGrid');
            grid.classList.toggle('list-view', mode === 'list');
            if (!skipRender && allFiles.length > 0) renderFiles();
        }

        // --- Load Entities ---
        async function loadEntities() {
            try {
                const data = await apiCall('GET', '/api/entities?deviceId=' + currentUser.deviceId);
                entities = (data.entities || []).filter(e => e.isBound);
                updateEntityMaps(entities);
                if (window.AvatarPetdx && currentUser.deviceId && currentUser.deviceSecret) {
                    const entityIds = entities.map(e => e.entityId).filter(id => id != null);
                    if (entityIds.length) {
                        await window.AvatarPetdx.preload({
                            deviceId: currentUser.deviceId,
                            deviceSecret: currentUser.deviceSecret,
                            entityIds
                        });
                        window.AvatarPetdx.autoMount();
                    }
                }
                renderEntityFilters();
            } catch (e) {
                console.warn('Failed to load entities:', e.message);
            }
        }

        function renderEntityFilters() {
            const container = document.getElementById('entityFilters');
            if (entities.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = entities.map(e => {
                const avatar = getAvatarForEntity(e.entityId);
                const name = e.name || (getEntityDisplayName(e.entityId) + ' #' + e.entityId);
                const isActive = currentEntityFilter === e.entityId;
                return '<div class="filter-chip' + (isActive ? ' active' : '') + '" data-entity="' + e.entityId + '" onclick="setEntityFilter(' + e.entityId + ')">' +
                    renderAvatarHtml(avatar, 20, e.entityId) + ' ' + escapeHtml(name) +
                    '</div>';
            }).join('');
        }

        // getAvatarForEntity is provided by shared/entity-utils.js

        // --- Time Filter ---
        function getTimeRange(filter) {
            const now = new Date();
            if (filter === 'today') {
                const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                return { since: start.getTime() };
            } else if (filter === 'week') {
                const start = new Date(now);
                start.setDate(start.getDate() - start.getDay());
                start.setHours(0, 0, 0, 0);
                return { since: start.getTime() };
            } else if (filter === 'month') {
                const start = new Date(now.getFullYear(), now.getMonth(), 1);
                return { since: start.getTime() };
            }
            return {};
        }

        function setTimeFilter(filter) {
            currentTimeFilter = filter;
            syncFilterControls();
            loadFiles();
        }

        // --- Load Files ---
        async function loadFiles(append = false) {
            if (isLoading) return;
            isLoading = true;

            if (!append) {
                allFiles = [];
                oldestTimestamp = null;
                document.getElementById('fileGrid').innerHTML =
                    '<div class="empty-state" id="loadingState"><div class="spinner" style="margin:0 auto 12px;"></div><div>' + i18n.t('files_loading') + '</div></div>';
            }

            try {
                let url = '/api/device/files?deviceId=' + currentUser.deviceId +
                    '&deviceSecret=' + currentUser.deviceSecret +
                    '&limit=200';

                if (currentTypeFilter !== 'all') {
                    url += '&type=' + currentTypeFilter;
                }
                if (currentEntityFilter !== null) {
                    url += '&entityId=' + currentEntityFilter;
                }

                // Time range
                const timeRange = getTimeRange(currentTimeFilter);
                if (timeRange.since) url += '&since=' + timeRange.since;
                if (timeRange.until) url += '&until=' + timeRange.until;

                if (append && oldestTimestamp) {
                    url += '&before=' + oldestTimestamp;
                }

                const data = await apiCall('GET', url);
                const newFiles = data.files || [];
                hasMore = data.hasMore || false;

                if (append) {
                    allFiles = allFiles.concat(newFiles);
                } else {
                    allFiles = newFiles;
                }

                if (allFiles.length > 0) {
                    oldestTimestamp = new Date(allFiles[allFiles.length - 1].createdAt).getTime();
                }

                renderFiles();
                updateStats();
            } catch (e) {
                if (!append) {
                    document.getElementById('fileGrid').innerHTML =
                        '<div class="empty-state">' + i18n.t('files_error') + '</div>';
                }
                showToast(e.message || 'Failed to load files', 'error');
            } finally {
                isLoading = false;
            }
        }

        function loadMore() {
            loadFiles(true);
        }

        // --- Filters ---
        function setFilter(type) {
            currentTypeFilter = type;
            document.querySelectorAll('.filter-bar > .filter-chip').forEach(c => {
                c.classList.toggle('active', c.dataset.type === type);
            });
            loadFiles();
        }

        function setEntityFilter(entityId) {
            if (currentEntityFilter === entityId) {
                currentEntityFilter = null;
            } else {
                currentEntityFilter = entityId;
            }
            renderEntityFilters();
            loadFiles();
        }

        // --- Rendering ---
        function renderEntityBadges(file) {
            const eIds = file.entityIds || [file.entityId];
            const isBroadcast = eIds.length > 1;

            let badges = '<div class="entity-badges">';
            eIds.forEach(eid => {
                const avatar = getAvatarForEntity(eid);
                badges += '<span class="entity-badge">' + renderAvatarHtml(avatar, 20, eid) + '</span>';
            });
            badges += '</div>';

            if (isBroadcast) {
                badges += '<div class="broadcast-badge">' + i18n.t('files_broadcast') + '</div>';
            }

            return badges;
        }

        function renderEntityNames(file) {
            const eIds = file.entityIds || [file.entityId];
            return eIds.map(eid => {
                const avatar = getAvatarForEntity(eid);
                return renderAvatarHtml(avatar, 18, eid) + ' ' + escapeHtml(getEntityName(eid));
            }).join(', ');
        }

        function renderFiles() {
            const grid = document.getElementById('fileGrid');
            const emptyState = document.getElementById('emptyState');
            const loadMoreContainer = document.getElementById('loadMoreContainer');

            // Re-apply view mode class
            grid.classList.toggle('list-view', currentViewMode === 'list');

            // Apply folder filter
            let displayFiles = getDisplayFiles();
            updateFileResultContext(displayFiles);

            if (displayFiles.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = '';
                loadMoreContainer.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            loadMoreContainer.style.display = hasMore ? '' : 'none';

            grid.innerHTML = displayFiles.map((file, idx) => {
                const realIdx = allFiles.indexOf(file);
                const date = formatFileDate(file.createdAt);
                const sourceLabel = file.isFromUser ? i18n.t('files_from_you') : (file.source || 'bot');
                const entityBadgesHtml = renderEntityBadges(file);
                const entityNamesHtml = renderEntityNames(file);

                const deleteBtn = '<button class="file-delete-btn" onclick="event.stopPropagation();deleteFile(' + realIdx + ')" title="Delete">&#x2715;</button>';
                const quoteBtn = '<button class="file-quote-btn" onclick="event.stopPropagation();quoteFileToChat(' + realIdx + ')" title="引用到聊天">📌</button>';
                const selCls = multiSelectIds.has(file.id) ? ' selected' : '';
                const cardAttrs = 'class="file-card' + selCls + '" data-fileidx="' + realIdx + '"' +
                    ' onclick="onFileCardClick(' + realIdx + ', event)"' +
                    ' oncontextmenu="onFileCardContextMenu(' + realIdx + ', event)"';
                if (file.type === 'photo') {
                    return '<div ' + cardAttrs + '>' +
                        deleteBtn + quoteBtn +
                        '<div class="file-thumb">' +
                        '<img src="' + escapeHtml(file.url) + '" alt="photo" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=file-thumb-icon>🖼️</div>\'">' +
                        entityBadgesHtml +
                        '</div>' +
                        '<div class="file-info">' +
                        '<span class="file-type-badge photo">' + i18n.t('files_type_photo') + '</span>' +
                        '<div class="file-entity">' + entityNamesHtml + '</div>' +
                        '<div class="file-source">' + escapeHtml(sourceLabel) + '</div>' +
                        (file.text ? '<div class="file-text">' + escapeHtml(file.text) + '</div>' : '') +
                        '<div class="file-date">' + date + '</div>' +
                        '</div></div>';
                } else {
                    return '<div ' + cardAttrs + '>' +
                        deleteBtn + quoteBtn +
                        '<div class="file-thumb">' +
                        '<div class="file-thumb-icon">🎙️</div>' +
                        entityBadgesHtml +
                        '</div>' +
                        '<div class="file-info">' +
                        '<span class="file-type-badge voice">' + i18n.t('files_type_voice') + '</span>' +
                        '<div class="file-entity">' + entityNamesHtml + '</div>' +
                        '<div class="file-source">' + escapeHtml(sourceLabel) + '</div>' +
                        (file.text ? '<div class="file-text">' + escapeHtml(file.text) + '</div>' : '') +
                        '<div class="file-date">' + date + '</div>' +
                        '</div></div>';
                }
            }).join('');

            attachLongPressListeners(grid);
        }

        function getEntityName(entityId) {
            return getEntityDisplayName(entityId) + ' #' + entityId;
        }

        function updateStats() {
            const stats = document.getElementById('fileStats');
            let displayFiles = getDisplayFiles();
            const photoCount = displayFiles.filter(f => f.type === 'photo').length;
            const voiceCount = displayFiles.filter(f => f.type === 'voice').length;
            stats.innerHTML = '<strong>' + displayFiles.length + '</strong> ' + tr('files_stats_total', 'files') +
                ' — ' + photoCount + ' ' + tr('files_type_photo', 'Photo') +
                ', ' + voiceCount + ' ' + tr('files_type_voice', 'Voice');
            updateFileResultContext(displayFiles);
        }

        // --- Preview ---
        function previewFile(idx) {
            const file = allFiles[idx];
            if (!file) return;

            const overlay = document.createElement('div');
            overlay.className = 'preview-overlay';

            const entityNamesHtml = renderEntityNames(file);
            const date = formatFileDate(file.createdAt);
            const sourceLabel = file.isFromUser ? i18n.t('files_from_you') : (file.source || 'bot');

            let contentHtml;
            if (file.type === 'photo') {
                contentHtml = '<div class="preview-content"><img src="' + escapeHtml(file.url) + '" alt="photo"></div>';
            } else {
                contentHtml = '<div class="preview-content"><div class="audio-player">' +
                    '<div class="audio-player-icon">🎙️</div>' +
                    '<audio controls src="' + escapeHtml(file.url) + '"></audio>' +
                    '</div></div>';
            }

            overlay.innerHTML =
                '<button class="preview-close" onclick="this.closest(\'.preview-overlay\').remove()">&times;</button>' +
                contentHtml +
                '<div class="preview-meta">' + entityNamesHtml + ' — ' + escapeHtml(sourceLabel) + ' — ' + date +
                (file.text ? '<br>' + escapeHtml(file.text) : '') +
                '</div>' +
                '<div class="preview-actions">' +
                (file.type === 'photo' ? '<button class="btn btn-primary btn-sm" onclick="downloadFile(' + idx + ')">' + i18n.t('files_btn_download') + '</button>' : '') +
                '<button class="btn btn-outline btn-sm" onclick="shareFile(' + idx + ')">' + i18n.t('files_btn_share') + '</button>' +
                '<button class="btn btn-outline btn-sm" onclick="quoteFileToChat(' + idx + ')">📌 引用</button>' +
                '<button class="btn btn-outline btn-sm" style="color:var(--error,#e53e3e);border-color:var(--error,#e53e3e)" onclick="deleteFile(' + idx + ')">' + i18n.t('files_btn_delete', 'Delete') + '</button>' +
                '</div>';

            document.body.appendChild(overlay);

            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.remove();
            });

            const escHandler = (e) => {
                if (e.key === 'Escape') {
                    overlay.remove();
                    document.removeEventListener('keydown', escHandler);
                }
            };
            document.addEventListener('keydown', escHandler);
        }

        // --- Download ---
        function downloadFile(idx) {
            const file = allFiles[idx];
            if (!file) return;

            if (file.type === 'photo') {
                const a = document.createElement('a');
                a.href = file.url;
                a.target = '_blank';
                a.download = 'eclaw_photo_' + new Date(file.createdAt).getTime() + '.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
            showToast(i18n.t('files_download_started'), 'success');
        }

        // --- Share ---
        async function shareFile(idx) {
            const file = allFiles[idx];
            if (!file) return;

            const shareData = {
                title: 'EClawbot ' + (file.type === 'photo' ? 'Photo' : 'Voice'),
                text: file.text || ('EClawbot ' + file.type),
                url: file.url
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        fallbackShare(file.url);
                    }
                }
            } else {
                fallbackShare(file.url);
            }
        }

        function fallbackShare(url) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast(i18n.t('files_link_copied'), 'success');
                }).catch(() => {
                    showToast(i18n.t('files_share_failed'), 'error');
                });
            } else {
                const ta = document.createElement('textarea');
                ta.value = url;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast(i18n.t('files_link_copied'), 'success');
                } catch (e) {
                    showToast(i18n.t('files_share_failed'), 'error');
                }
                document.body.removeChild(ta);
            }
        }

        // --- Delete ---
        async function deleteFile(idx) {
            const file = allFiles[idx];
            if (!file) return;
            if (!await showConfirm({ message: i18n.t('files_delete_confirm', 'Are you sure you want to delete this file?'), confirmText: i18n.t('common_delete'), danger: true, itemName: file.text || file.url })) return;

            try {
                const resp = await apiCall(
                    'DELETE',
                    '/api/device/files/' + encodeURIComponent(file.id) +
                        '?deviceId=' + encodeURIComponent(currentUser.deviceId) +
                        '&deviceSecret=' + encodeURIComponent(currentUser.deviceSecret)
                );
                if (resp.success) {
                    allFiles.splice(idx, 1);
                    renderFiles();
                    updateStats();
                    // Close preview overlay if open
                    const overlay = document.querySelector('.preview-overlay');
                    if (overlay) overlay.remove();
                    showToast(i18n.t('files_deleted', 'File deleted'), 'success');
                } else {
                    showToast(resp.error || 'Delete failed', 'error');
                }
            } catch (e) {
                showToast(i18n.t('files_delete_failed', 'Failed to delete file'), 'error');
            }
        }

        // ===================================================================
        // Multi-select mode (long-press a file card → batch-attach to chat)
        // ===================================================================
        let multiSelectMode = false;
        const multiSelectIds = new Set();
        const LONG_PRESS_MS = 500;
        const LONG_PRESS_MOVE_TOL = 8;
        let _lpTimer = null;
        let _lpStart = null;
        let _lpIdx = null;
        let _lpFiredIdx = null; // suppress the click that follows a long-press

        function onFileCardClick(idx, ev) {
            // If the long-press just fired on this card, its mouseup/touchend
            // synthesises a click — swallow it so we don't also toggle twice
            // or open a preview right after entering multi-select.
            if (_lpFiredIdx === idx) {
                _lpFiredIdx = null;
                ev.preventDefault();
                ev.stopPropagation();
                return;
            }
            if (multiSelectMode) {
                ev.preventDefault();
                ev.stopPropagation();
                toggleMultiSelect(idx);
                return;
            }
            previewFile(idx);
        }
        function onFileCardContextMenu(idx, ev) {
            // Desktop right-click → existing move-to-folder flow.
            // On touch devices the long-press path enters multi-select first
            // (_lpFiredIdx is set), so we suppress the synthesised contextmenu.
            ev.preventDefault();
            if (_lpFiredIdx === idx || multiSelectMode) return;
            moveFileToFolder(idx);
        }

        function toggleMultiSelect(idx) {
            const file = allFiles[idx];
            if (!file) return;
            if (multiSelectIds.has(file.id)) multiSelectIds.delete(file.id);
            else multiSelectIds.add(file.id);
            const card = document.querySelector('[data-fileidx="' + idx + '"]');
            if (card) card.classList.toggle('selected', multiSelectIds.has(file.id));
            renderMultiSelectBar();
            // Exit when user deselects the last card (matches mobile photo-picker UX)
            if (multiSelectIds.size === 0) exitMultiSelectMode();
        }

        function enterMultiSelectMode(initialIdx) {
            if (!multiSelectMode) {
                multiSelectMode = true;
                document.body.classList.add('multi-select-mode');
            }
            if (initialIdx != null) toggleMultiSelect(initialIdx);
            renderMultiSelectBar();
        }
        function exitMultiSelectMode() {
            if (!multiSelectMode) return;
            multiSelectMode = false;
            multiSelectIds.clear();
            document.body.classList.remove('multi-select-mode');
            document.getElementById('multiSelectBar')?.remove();
            // Strip .selected from any still-styled cards without re-fetching.
            document.querySelectorAll('.file-card.selected').forEach(c => c.classList.remove('selected'));
        }

        function renderMultiSelectBar() {
            const count = multiSelectIds.size;
            let bar = document.getElementById('multiSelectBar');
            if (count === 0) { bar?.remove(); return; }
            if (!bar) {
                bar = document.createElement('div');
                bar.id = 'multiSelectBar';
                bar.className = 'multi-select-bar';
                document.body.appendChild(bar);
            }
            const countLabel = i18n.t('files_multi_select_count', 'Selected') + ': ' + count;
            const attachLabel = '🧷 ' + i18n.t('files_multi_select_attach', 'Attach to chat');
            const cancelLabel = '✖ ' + i18n.t('files_multi_select_cancel', 'Cancel');
            bar.innerHTML =
                '<span class="ms-count">' + escapeHtml(countLabel) + '</span>' +
                '<button class="btn btn-primary btn-sm" onclick="attachSelectedFiles()">' + attachLabel + '</button>' +
                '<button class="btn btn-outline btn-sm" onclick="exitMultiSelectMode()">' + cancelLabel + '</button>';
        }

        function attachSelectedFiles() {
            if (multiSelectIds.size === 0) return;
            const staged = allFiles
                .filter(f => multiSelectIds.has(f.id))
                .map(f => ({
                    id: f.id,
                    type: f.type,
                    mediaUrl: f.url,
                    fileName: (f.text && f.text.trim() ? f.text.trim().slice(0, 60) : '')
                        || (f.type + '_' + new Date(f.createdAt).toISOString().slice(0, 10)),
                }));
            try {
                sessionStorage.setItem('eclaw_pending_attach_files', JSON.stringify({
                    files: staged, ts: Date.now()
                }));
            } catch (_) {}
            exitMultiSelectMode();
            // SmartRouter proof slice: single→full nav, split→sibling chat pane swap,
            // app→native chat tab. Falls back to raw nav if router absent.
            if (window.SmartRouter) window.SmartRouter.navigate('chat');
            else window.location.href = '/portal/chat.html';
        }

        // --- Long-press / pointer handling ---
        function _lpClear() {
            if (_lpTimer) { clearTimeout(_lpTimer); _lpTimer = null; }
            _lpStart = null;
            _lpIdx = null;
        }
        function attachLongPressListeners(grid) {
            if (!grid || grid._lpBound) return;
            grid._lpBound = true;

            grid.addEventListener('pointerdown', (e) => {
                // Ignore right-button / middle-button (they have their own handlers).
                if (e.button && e.button !== 0) return;
                const card = e.target.closest('[data-fileidx]');
                if (!card) return;
                const idx = parseInt(card.getAttribute('data-fileidx'), 10);
                if (isNaN(idx)) return;
                // Skip long-press if user started on an action button.
                if (e.target.closest('.file-delete-btn, .file-quote-btn')) return;

                _lpClear();
                _lpStart = { x: e.clientX, y: e.clientY };
                _lpIdx = idx;
                _lpTimer = setTimeout(() => {
                    _lpTimer = null;
                    _lpFiredIdx = idx;
                    enterMultiSelectMode(idx);
                    // Clear the suppression after the click event fires.
                    setTimeout(() => { if (_lpFiredIdx === idx) _lpFiredIdx = null; }, 400);
                }, LONG_PRESS_MS);
            });

            grid.addEventListener('pointermove', (e) => {
                if (!_lpTimer || !_lpStart) return;
                if (Math.abs(e.clientX - _lpStart.x) > LONG_PRESS_MOVE_TOL ||
                    Math.abs(e.clientY - _lpStart.y) > LONG_PRESS_MOVE_TOL) {
                    _lpClear();
                }
            });

            const endHandler = () => { if (_lpTimer) _lpClear(); };
            grid.addEventListener('pointerup', endHandler);
            grid.addEventListener('pointercancel', endHandler);
            grid.addEventListener('pointerleave', endHandler);
        }

        // Global ESC exits multi-select.
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && multiSelectMode) {
                exitMultiSelectMode();
            }
        });

        // Clicking outside any file card or the action bar exits multi-select.
        // Use capture so we see the click before any inline onclick fires;
        // we still let file-card / bar clicks through their own handlers.
        document.addEventListener('click', (e) => {
            if (!multiSelectMode) return;
            if (e.target.closest('.file-card') || e.target.closest('.multi-select-bar')) return;
            // Filter chips / folder chips / nav / footer all count as "empty area" for exit purposes.
            exitMultiSelectMode();
        });

        // --- Helpers ---
        function quoteToChat(source, title, excerpt) {
            if (window.self !== window.top) {
                window.parent.postMessage({ type: 'eclaw_quote', source, title, excerpt: excerpt || '' }, window.location.origin);
            } else {
                localStorage.setItem('eclaw_pending_quote', JSON.stringify({ source, title, excerpt: excerpt || '', ts: Date.now() }));
                // Not embedded → single mode; SmartRouter resolves to full chat nav.
                if (window.SmartRouter) window.SmartRouter.navigate('chat');
                else window.location.href = '/portal/chat.html';
            }
        }

        function quoteFileToChat(idx) {
            const file = allFiles[idx];
            if (!file) return;
            const typeLabel = file.type === 'photo' ? '📷 照片' : '🎙️ 語音';
            const entityName = getEntityName(file.entityId || 0);
            const title = typeLabel + ' — ' + entityName;
            const excerpt = file.text ? file.text.slice(0, 80) : file.url.split('/').pop().slice(0, 60);
            quoteToChat('Files', title, excerpt);
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatFileDate(ts) {
            if (!ts) return '';
            const d = new Date(ts);
            const now = new Date();
            const isToday = d.toDateString() === now.toDateString();
            if (isToday) {
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            return d.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' }) + ' ' +
                d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
    </script>
    </main>
